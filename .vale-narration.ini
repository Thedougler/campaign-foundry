# Craft checks for [!narration] callouts only, read by the style layer's narration pass (src/check/layers/style.ts).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

[*.md]
BasedOnStyles = proselint, write-good
# Upstream write-good makes E-Prime opt-in: it flags every copula (is, are, was), which the house style teaches.
write-good.E-Prime = NO
# DM-confirmed misfire on literal campaign meaning: "divers" are the people on the dive lines, never the archaic "several".
proselint.Archaisms = NO
