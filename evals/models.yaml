# Cross-family model matrix. Read by .agents/skills/run-evals and
# .agents/skills/skill-creator. Values are exact `provider/model-id` pins from
# `omp models` (which lists bare model ids under provider headers — join the
# header and the id). Outside oh-my-pi, `cheap` on `openai` and `glm` supplies
# ordinary skill-eval runners (one family per run, rotating openai → glm).
# Inside oh-my-pi, ordinary evals use the configured TEST-SUBJECT and
# PROSE-GRADER roles instead. top = Prose Benchmark runners (rare, leaderboard). Runners are reasoning
# models: every omp run passes `--thinking high` (the DM requires luna at
# thinking >= high); a pin whose `omp models` thinking tiers lack `high` is
# invalid — re-pin or record SKIPPED. On a dead pin try `fallback` once; if
# that also fails record SKIPPED with a reason and continue. No copilot and
# no openrouter-backed providers.
families:
  openai:
    top:    {model: openai-codex/gpt-6.1-sol, fallback: opencode-zen/gpt-6.1-sol}
    cheap:  {model: openai-codex/gpt-5.6-luna, fallback: opencode-go/gpt-5.6-luna}
  grok:
    top:    {model: xai-oauth/grok-4.7, fallback: opencode-go/grok-4.7}
    cheap:  {model: xai-oauth/grok-4.5, fallback: opencode-go/grok-4.5}
  glm:
    top:    {model: zai/glm-5.3, fallback: opencode-go/glm-5.3}
    cheap:  {model: zai/glm-5.3-flash, fallback: opencode-go/glm-5.3-flash}

# Judge substitutes: used ONLY when the native Claude Opus 5.5 Judge cannot
# answer (no claude CLI). One random pick per benchmark run (never per sample),
# recorded as `judge` in evals/benchmark.json. The pool is the benchmark's own
# `top` pins; samples reach the Judge anonymized either way.
judge_fallback_pool:
  - zai/glm-5.3
  - openai-codex/gpt-6.1-sol
  - xai-oauth/grok-4.7
