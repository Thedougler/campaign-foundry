- id: previously-on
  fixture_page: Sessions/Session 2/Session 2 - Recap.md
  context: |
    type: Recap
    summary: "The Party crossed the Under-Boards, spoke the names of the drowned and took the Vessen ledger from Sable."
    date: "23 Eelrun 412 CY"

    ## At a glance

    - **Session.** Session 2, played on 22 and 23 Eelrun 412 CY.
    - **Party at.** The tally house in [[Reedholt]], on the evening of 23 Eelrun.
    - **Big moments.** The Party beat two Mire Drowners in the mud, spoke the names of Vessen's dead to [[Sable]] and took the ledger.
    - **Left open.** Whom to tell about the ledger, and the groan of Crookback Sluice.

    ## What happened

    The bell rang before dawn and the water under [[Reedholt]] dropped a foot. [[Odalys Ferro]] calmed the crowd on the plank walk while [[Nib Ashwater]] pulled the Party into the tally house. Nib showed them the tally-sticks of the drowned, and Odalys read the Vessen knots. Nib told them the ledger lay in the bell loft. [[Pell Rushlight]] brought a note from [[Hobb Tarrow]] warning that [[Ilse Corran]]'s boats were on the water.

    The Party crossed the Under-Boards along a shell ridge. Two [[Mire Drowner]] creatures attacked from the mud. [[Brannoch Vell]] held the ridge while [[Tamsin Wick]] and Odalys dragged a grappled ally clear, and the Party used one charge of the [[Ebb Lantern]] to cross the last stretch dry.

    In the chapel tower the Party met [[Sable]]. Three goblin hands of [[The Reedrunners]] climbed the stair behind them. Odalys spoke the names of the drowned aloud, and Sable gave her the ledger. The goblins fled when Brannoch held the stair. The tide returned as the Party left the chapel.

    Back in the tally house the Party read the marked page. The ledger records the Compact's order to open Crookback Sluice and is signed Corvin Tarrow. At dusk a groan rolled in from the east.

    ## Changes

    - [[Harbormaster's Ledger of Vessen]] is now held by the Party, and [[Odalys Ferro]] carries it.
    - [[Sable]] gave up the ledger and has stopped ringing the bell.
    - [[Ebb Lantern]] has 2 charges left until dawn.
    - [[Nib Ashwater]] trusts the Party and has shown them the tally-sticks.
    - [[Hobb Tarrow]] is confirmed as a descendant of the clerk who signed the order. The Party has not told him.
    - [[The Drowned Chapel]] is now known to the Party, with its tidemarks and the empty niche in the loft.
    - [[Crookback Sluice]] groaned at dusk, and Pell says it has never done so in his lifetime.

    ## Threads

    - [[The Silent Bell]] moved. The Party holds the ledger, and the bell has stopped.
    - [[Reedrunner Tithe]] moved. Ilse's crew failed to take the ledger and will look for the Party.
    - [[The Failing Sluice]] opened its first sign, the groan at dusk.
