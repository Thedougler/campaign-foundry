# Prose Benchmark prompt set: one Narration sample per content type, grounded
# in a fixture page from test/fixtures/vault/. bench_version is the first 12
# hex of this file's sha256; any edit here moves it and invalidates the cache.
# Entries are self-contained: `context` is pasted fact content from the fixture
# page (existing [!narration] blocks and ## Play onward stripped) and no
