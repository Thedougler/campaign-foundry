    Played Session: 11. Date: 1495 DR, month and weekday not established.
    Party: four level-5 PCs, Delmar, Perrin, Crissdalynn and Jean-Claude.
    Jean-Claude stopped responding; Delmar carried him in his coat, not a bag.
    Adult Bloodhawk killed the Crown Squid; Party fled inland rather than fought.
    Crissdalynn ate fallen redheart fruit, then picked living fruit. Wolfrabbits
    and young Bloodhawks came. Illusions and a false fat Perrin drew them away.
    Delmar drove off a Spiguar; it was not killed.
    At the Slack Basin, Crissdalynn freed Matteo from three giant otters. The
    Party tired them through play. Matteo confirmed fallen fruit was safe,
    ate a ghost plum and vanished. He wanted passage off Aruhe.
    At Matteo's camp, Perrin moved a Lesser Black Lotus into the river; failed
    handling caused Tasha's Hideous Laughter and the flower drifted away.
    A garden voice called; lantern light drove an unseen watcher off a porcupine.
    On Crissdalynn's watch, Skarn missed a strike for the pack and used one
    Legendary Resistance against her stunning strike. Play stopped with him
    still in her face and the Spinner still hers, not after a completed theft.
