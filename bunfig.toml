# Match vitest.config.ts include: only this repo's suite under test/.
# Without root, bare `bun test` follows prior/ai-co-dm/foundry-data → FoundryVTT Data
# and runs foreign modules outside the project.
[test]
root = "./test"

# Script output only: no "$ <command>" echo or "error: script … exited" line, so
# `bun run cfcli -- … --json` prints parseable JSON. Exit codes are unchanged.
[run]
silent = true
