- id: reedrunner-leader
  prompt: Who leads the Reedrunners, and what statistics does she use in a fight?
  checks:
    canon:
      Lowtide/NPCs/Ilse Corran.md: ['creature: "\[\[Bandit Captain\]\]"', Ilse Marrow]
  rubrics:
    - The answer names Ilse Corran as the Reedrunners' leader and the Bandit Captain as her statistics, citing both pages as wikilinks.
    - Every fact in the answer appears on a fixture page; nothing is invented and presented as Wiki fact.
    - The Wiki diff is empty, because nothing in this answer is a keeper.
    - How Ilse fought is taken from the Recaps, and anything drawn from a Prep or Scene page is presented as what was planned, not what happened.
    - The answer stays on the two things asked; it runs no more than about 12 lines before any "Not in the Wiki" line.
