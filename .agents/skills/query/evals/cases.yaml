- id: dm-states-fact
  prompt: Pell has a sister, Wenna, who works the eel traps at Reedholt. Anyway, does Pell know how his father really died?
  checks:
    canon:
      Lowtide/NPCs/Pell Rushlight.md: [Wenna]
      Lowtide/log.md: ['/\] query \|/']
  rubrics:
    - The answer gives the recorded story (a wreck struck the landing) and the hidden truth (the Reedrunners killed him, learnable from Nib Ashwater) with citations, and names as a gap that the Wiki does not say what Pell himself believes.
    - Wenna is filed on Pell Rushlight's page as a fact in its own section, not as a question-and-answer block, and the answer closes by naming the page edited.
    - The Agent filed Wenna without asking the DM for permission.
    - Nothing the Wiki doesn't state (such as what story Pell tells, or whether he suspects) appears in the body as fact; readings sit under "Not in the Wiki".
