# Default: grounded adaptation combining rescue, nested refuge and repeat expeditions in one exploration Site.
- id: dungeon
  source_pages:
    - shattered-sea/Locations/lava-tubes.md
    - shattered-sea/Locations/the-long-meadow.md
    - shattered-sea/Locations/memorial-grove.md
