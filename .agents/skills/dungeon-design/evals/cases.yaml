  rubrics:
    - >-
      The keys alone support an entrance-to-rescue route, deeper exploration
      and retreat. Connections name both endpoints and agree across the
      parent Site and nested refuge, with travel costs, advance cues and
      meaningful alternatives appropriate to the physical tubes. Areas have
      distinctive activity, occupants, usable features, discoverable answers
      and exits; quiet areas and noncombat rewards give concrete reasons to
      explore again. The frontier toward Clear Lake is reachable and bounded,
      not an unlimited promise of unmapped tunnels.
    - >-
      Rescue, hazards and confrontations are adjudicable under 2024 5e and
      applicable House Rules while preserving sourced extraction options
      and mechanics. Warnings, triggers, effects, counterplay, distinct
      bypasses and leverage make danger answerable. The actual Party's
      movement, flight, ropes, healing and current participation inform
      difficulty; fights have counts, linked Creature rules, sourced
      calibration where added, purposes, terrain, consequences, nonviolent
      resolutions and retreat rather than compulsory attrition.
    - >-
      Pressure, rest and return form one coherent procedure the DM can run:
      the starting state, elapsed-time or action advances, visible signs,
      threshold consequences and ways to alter progress are explicit.
      Shelters, exposure, costs and a safer alternative apply 2024 rest rules
      without pausing the island or its occupants. Secured ropes, damage,
      depleted rewards, rescues and bargains would persist; repairs and
      restocking have named causes, resources and time rather than resetting
      a cleared Site for the next expedition.
    - >-
      The tubes' history and current situation explain their evidence and
      occupants' wants. Starting entrances, the ledge, tube connections,
      survivors' condition and underground taking law remain coherent with
      the live sources. Essential truths have three independent Clues that
      survive losing a witness, route or roll, and necessary progress is not
      gated by one check. NPC, Creature and notable Item dependencies resolve
      to owner pages. New stock stays prospective: survivors are not already
      rescued, the refuge is not secured and Session Prep is not played history.
    - >-
      Entering and keyed spoken cues make the tubes and refuge pictureable
      after one hearing, with concrete forms at familiar body scale, placed
      features, visible movement and an actionable exit or feature. Each
      cue conveys its area's difference without repeating a generic cave
      description. Hidden routes, truths, DCs and procedures remain DM-side;
      no PC action or feeling is assumed, and any live danger stops before
      Players have their first chance to act.
