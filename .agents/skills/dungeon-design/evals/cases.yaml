# Grounded adaptation: rescue and a returnable refuge share one exploration Site.
- id: tubes-and-refuge
  source_pages:
    - The Shattered Sea/Locations/Lava Tubes.md
    - The Shattered Sea/Locations/The Long Meadow.md
  prompt: >-
    Stock the Lava Tubes so I can run the rescue from the smoking skylight
    and exploration beyond it. Make the ledge a small nested Site called
    Lava Tube Refuge that the crew could secure and return to, with routes
    deeper toward Clear Lake and reasons to come back besides fighting.
  checks:
    pages:
      - The Shattered Sea/Locations/Lava Tubes.md
      - The Shattered Sea/Locations/Lava Tube Refuge.md
    canon:
      The Shattered Sea/Locations/Lava Tubes.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Site\s*$'
      The Shattered Sea/Locations/Lava Tube Refuge.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Site\s*$'
        - '^parent:\s*"\[\[Lava Tubes\]\]"\s*$'
    absent:
      The Shattered Sea/Locations/Lava Tubes.md:
        - '^```statblock\b'
      The Shattered Sea/Locations/Lava Tube Refuge.md:
        - '^```statblock\b'
  rubrics:
    - >-
      The starting entrances, ledge, tube connections, hazards and survivors'
      condition remain consistent. Rescue and retreat are traceable through
      the keys, with existing extraction options and mechanics usable.
      The actual Party's movement, flight, ropes, healing and participation
      inform challenges, and the island's taking law reaches underground.
    - >-
      Areas have distinctive cues, activity, interactions, discoverable
      information and exits. Essential progress has independent paths.
      Hazards offer warnings, triggers, effects, bypasses and counterplay;
      occupants have wants and responses. Pressure and rest have explicit
      conditions and consequences rather than an arbitrary expedition clock.
    - >-
      The nested refuge and its approaches form a coherent, returnable Site.
      Routes name both ends and agree with the parent Site. Noncombat reasons
      to return and the frontier toward Clear Lake are discoverable. Rescue,
      secured ropes, damage or bargains would leave persistent changes, with
      repair or restocking tied to actors, resources and time.
    - >-
      Owner pages hold NPC, Creature and Item rules, and dependencies resolve.
      New exploration details are prospective design: the trapped survivors
      have not been rescued, the refuge has not been secured and prepared
      Session outcomes have not become history.
