# One packed run: stock the tubes and nest a returnable refuge.
- id: tubes-and-refuge
  source_pages:
    - The Shattered Sea/Shattered Sea/hot.md
    - The Shattered Sea/Locations/Lava Tubes.md
    - The Shattered Sea/Locations/The Long Meadow.md
    - The Shattered Sea/Locations/Memorial Grove.md
    - The Shattered Sea/NPCs/Ettore Ferrante.md
    - The Shattered Sea/NPCs/Luca Ferrante.md
    - The Shattered Sea/Lore/Taking on Aruhe.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
    - The Shattered Sea/Shattered Sea/PCs/Perrin Black-Jaw.md
    - The Shattered Sea/Shattered Sea/PCs/Delmar Fisk.md
    - The Shattered Sea/Shattered Sea/PCs/Crissdalynn Khinriss.md
    - The Shattered Sea/Shattered Sea/PCs/Jean-Claude Tabarnack.md
  prompt: >-
    Two stocking jobs, one reply, one create operation. Neither rescue nor an
    expedition has happened. (1) Stock the existing Lava Tubes for exploration
    and rescue from the Long Meadow smoking skylight. Make the ledge, east and
    west tubes, daylight wells, seep and vents navigable, with Clues, hazards,
    occupants, pressure and rest. Keep the four trapped Calveno survivors,
    Ettore's injury, Luca's tally, the recorded climb and footing DCs, and the
    option to haul all four out in ten minutes. Link existing owner pages
    before inventing dependencies. (2) Add a nested Site, Lava Tube Refuge,
    around the smoking-skylight ledge. Subdivision of the real Site, not a new
    discovered expedition. Prepare the accessible refuge and adjoining
    east/west approaches for repeat visits, with the deeper Clear Lake route as
    a discoverable frontier. Distinct reasons to return besides fighting. Keep
    the four survivors trapped until play resolves rescue. Show how extraction,
    secured ropes, damaged access or bargains would persist if those choices
    occur. Add entrance and cross-Site routes to Lava Tubes without changing
    its established facts. Account for the current Party, including Jean-Claude
    carried in Delmar's coat. Do not invent a past survey, elapsed absence or
    completed rescue. Leave hot and Session records alone. No art or Foundry
    work.
  checks:
