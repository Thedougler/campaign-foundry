    - shattered-sea/PCs/delmar-fisk.md
    - shattered-sea/PCs/jean-claude-tabarnack.md
    - shattered-sea/PCs/perrin-black-jaw.md
  prompt: >-
    Stock the Lava Tubes so I can run the rescue from the smoking skylight
    and exploration beyond it. Make the ledge a small nested Site called
    Lava Tube Refuge that the crew could secure and return to, with routes
    deeper toward Clear Lake and reasons to come back besides fighting.
    Give me complete pages I can run at the table, including what I read
    as they enter and how searching, resting and coming back change things.
  checks:
    pages:
      - shattered-sea/Locations/lava-tubes.md
      - shattered-sea/Locations/lava-tube-refuge.md
    sections:
      shattered-sea/Locations/lava-tubes.md:
