  rubrics:
    - >-
      Lava Tubes keep Long Meadow skylight, marsh and roots entrances, the
      established ledge and areas, nineteen-day stranding, four named
      survivors, Ettore's broken shin, Luca's twentieth-day resolve, existing
      footing/climb DCs and ten-minute rope extraction. Session 12 prepared
      rescue outcomes are not observed events. From the keys, a reader can
      trace entry, rescue, underground investigation and retreat. Edges agree
      at both ends. Flight, ropes, healing, carried Jean-Claude and island law
      still work.
    - >-
      Every area has cue, activity, interaction, find or truth, relevant
      uncertainty and exits. Essential revelations have three independent
      Clues; progress is not one roll. Hazards have sign, trigger, effect,
      counterplay, bypass and leverage; existing mechanics stay. Occupants have
      wants and responses. Confrontations have purpose, terrain, consequences,
      nonviolent resolution and retreat. Creature/NPC/Item rules stay on owner
      pages. Pressure and rest have explicit triggers, signs, consequences and
      sourced Short/Long Rest rules. Custom pressure is Site-specific.
    - >-
      Flat Location/Site layout: Aruhe contains Lava Tubes contains Lava Tube
      Refuge. Areas are keys. Cross-Site routes name both ends. The refuge
      supports a goal-and-return visit with alternative routes and non-combat
      reasons to return. Clear Lake is discoverable without prewriting the
      island. Return state separates current evidence from conditional play:
      survivors still trapped; ropes, rescue, damage and bargains persist if
      chosen. Repair or restock needs actor, resources, time and a sign.
    - >-
      Current templates, resolved links, honest provenance. One full
      scratch-root gate and one create log. No recursive location/dungeon
      loop, no new permanent Scenes, no changed hot or Session records.
