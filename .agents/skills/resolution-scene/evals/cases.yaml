- id: resolution-scene
  source_pages:
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Prep.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Consume.md
    - The Shattered Sea/Shattered Sea/Shattered Sea.md
  prompt: >-
    Redo The Way Out for whatever Consume actually leaves us with: Spinner
    kept or stolen, capture, Perrin refusing, people lost, turning back.
  checks:
    pages:
      - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md
    sections:
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md:
        - '## At a glance'
        - '## Play'
        - '### Payoffs'
        - '### Reactions'
        - '### Rewards'
        - '## Threads'
    canon:
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md:
        - '^type:\s*Scene\s*$'
        - '^kind:\s*Resolution\s*$'
        - '^> \[!narration\] Closing image\s*$'
  rubrics:
    - >-
      The DM can select and run a short aftermath for every reachable Consume
      exit, with branch triggers, payoffs, NPC responses and usable next
      choices. Each touched Thread has a concrete resulting state and any
      remaining pressure; the next Session's starting place, possession,
      custody, knowledge and costs are explicit rather than left to decide later.
    - >-
      Closing images, survivor decisions and Thread states follow the actual
      preceding result. Lost people, spent resources, a stolen Spinner and
      refused bargains stay effective. Nine departing and three staying is
      one prepared possibility, not an event already played, and a branch
      cannot undo capture, death or a blocked route without sourced means.
    - >-
      Earned rewards, available Items, advancement and any continuing
      conditions agree with their retrieved owners and the Campaign's
      practice under 2024 5e. Rewards state who can grant them, their practical
      effect and any remaining choice; unsuccessful branches do not silently
      receive the successful rescue's gifts or reset costs.
    - >-
      The visible change and its cost are specific to this rescue and these
      relationships, not a generic victory speech. Each present PC has space
      to answer their own stakes without prescribed words or emotions. Plain
      closure is valid; any stinger grows from what the Session actually
      changed and leaves pursuit or acceptance to the Players.
    - >-
      Every branch's Closing image is speakable after one hearing and true
      for the people, possessions and losses in that branch. Concrete forms,
      scale against familiar things and sourced sensory details make the
      changed situation pictureable. It lands on a still image or, for a
      stinger, stops before Players must act, with no mechanics, secrets or
      assigned PC action, feeling or thought in spoken text.
