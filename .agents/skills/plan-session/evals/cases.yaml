  prompt: Let's talk through Session 12's existing plan before we run it.
  rubrics:
    - The reply opens with the Campaign's current state in five to ten lines with links, using the played Recap's unresolved Skarn attack rather than hot's inconsistent breaking-off claim.
    - It offers two or three concrete directions grounded in Aruhe's fruit law, inland survivors, the Spinner hunt, Grung orders or Perrin's patron, distinguishing current facts from prepared possibilities.
    - PC levels and Jean-Claude's last played state match this run's starting Sheets and Recap. No recovery, rescue outcome or later-level reward is asserted as already played.
    - It ends with at most two questions offering two or three specific options, asks nothing about bookkeeping, and keeps the Wiki diff empty.
- id: dm-fixed-points
  source_pages:
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Prep.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Orders in the Ash.md
