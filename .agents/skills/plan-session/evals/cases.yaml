    - The Shattered Sea/Lore/Two-Grave Orders.md
    - The Shattered Sea/Items/Fate Spinner.md
  prompt: For Session 12 I want the two-grave orders to land hard, and Perrin's choice about CONSUME to be the emotional centre. Build on those two points in the existing Prep.
  rubrics:
    - Both DM preferences are accepted as fixed points and developed rather than replaced, challenged or silently turned into outcomes the PCs must choose.
    - At least two concrete additions have Canon page links, using the seals' order chain, the Spinner hunt or Aruhe's law as grounding. New staging is clearly a pitch rather than prior play.
    - The reply is a warm, tight co-writing turn with at most two questions offering specific choices, not an interrogation or bookkeeping checklist.
    - The Wiki diff is empty and Session 12 remains unplayed.
- id: settle
  source_pages:
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Prep.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Dawn Strike.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Consume.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Crissdalynn Khinriss.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Delmar Fisk.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Jean-Claude Tabarnack.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Perrin Black-Jaw.md
  prompt: "Settle Session 12 using the existing six-Scene route. Opening is Skarn cutting at Crissdalynn's harness at the Slack Basin. Middle is the lava-tube rescue, Terror-Birds and reading the Gold-caste orders. Climax is the Pantry, Skarn's last Spinner attempt and Perrin's choice to consume. Resolution is the survivors choosing who leaves and who stays. Tone is consequential rescue and found family. Keep Perrin's choice central, Crissdalynn on the Spinner, Delmar protecting civilians and Jean-Claude on the Grung orders. Treat his ability to act as a Prep question because his last played state was catatonic. That's everything, settle it."
  rubrics:
    - The settled intent contains Promise, Tone, Fixed points, Opening, Threads, Climax, Resolution, Spotlights and Left to Prep.
    - Fixed points preserve the DM's words and existing route. The survivors' and PCs' choices remain situations for play, not guaranteed results asserted as Canon.
    - Spotlights account for all four named PCs, with Perrin's consume choice central and Jean-Claude's unresolved capability retained under Left to Prep rather than an invented recovery.
    - It hands the intent to prep-session without writing the Wiki; the Wiki diff is empty and played Session 11 records stay unchanged.
