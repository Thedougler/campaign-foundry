- id: cold-open
  source_pages:
    - shattered-sea/Sessions/Session 11/session-11-recap.md
    - shattered-sea/Sessions/Session 12/session-12-prep.md
    - shattered-sea/shattered-sea.md
  prompt: Help me plan Session 12. We're redoing it from the top since all the skills have had significant upgrades since it was written.
  rubrics:
    - The opening orients the DM in the current Campaign with relevant page links and offers concrete directions connected to the Party's live stakes. Facts about prior play follow this run's starting Recap and current PC pages; conflicts with hot or unplayed Prep are distinguished rather than silently resolved as played events.
    - The reply builds on the rescue, Spinner hunt and Aruhe context with playable pitches, separating established facts from new possibilities. Jean-Claude's capability follows the starting played records because this ask supplies no recovery override.
    - The turn is a concise co-writing conversation with useful options and at most two intent questions, rather than a page-maintenance interview. It leaves the Wiki unchanged.
- id: dm-fixed-points
  source_pages:
    - shattered-sea/Sessions/Session 12/session-12-prep.md
    - shattered-sea/Sessions/Session 11/session-11-recap.md
    - shattered-sea/Lore/two-grave-orders.md
  prompt: >-
    Jean-Claude will be awake at the start. He was only catatonic because his
    Player was absent. Hinewai assuming he's under an authority seal is
    worldbuilding, not a new plot. The survivors' smoke is the main driver,
    and we need four hours. Build on that and Perrin's choice about CONSUME.
  rubrics:
    - The reply accepts the DM's awake-at-start override without inventing a cure or rewriting Session 11. Hinewai's mistaken assumption remains a worldbuilding detail about compulsion and inherited guilt, not a new quest or proof of Jean-Claude's personal guilt.
    - Concrete additions connect the smoke-led rescue and Perrin's voluntary choice to this run's retrieved Aruhe, orders and patron context. They preserve the four-hour intent and leave new staging as pitches rather than already-played outcomes.
    - The conversation builds on the fixed points with relevant Canon links and a useful next choice, stays concise, and leaves the Wiki unchanged.
- id: settle
  source_pages:
    - shattered-sea/Sessions/Session 12/session-12-prep.md
    - shattered-sea/Sessions/Session 11/session-11-recap.md
  prompt: >-
    That's the plan, settle Session 12. Four hours following the survivors'
    smoke deeper into Aruhe, with Jean-Claude awake. Skarn wants the Spinner
    for Vantyrus and is loyal to him now. I like the second attempt later,
    after a fallen Ghost Plum, with Auralis telling Perrin CONSUME beside
    living Giant's Guava. Obedience, inherited guilt and personal choice are
    the heart of it. The two-grave orders and Hinewai put Jean-Claude in the
    middle; the ending is who gets out and who chooses to stay.
  rubrics:
    - The settled intent contains Promise, Tone, Fixed points, Opening, Threads, Climax, Resolution, Spotlights and Left to Prep.
    - The settled intent preserves the DM's rescue driver, four-hour scope, themes, awake Jean-Claude and current Skarn loyalty. Source-backed details follow the starting pages; new staging is identified as design still left to Prep.
    - Spotlights give the current Party meaningful opportunities grounded in their starting goals and bonds. Perrin can trust or refuse Auralis, and the Spinner, Skarn and survivor endings remain questions for play rather than guaranteed results.
    - The reply provides a usable handoff to prep-session without writing the Wiki or recasting future Session 12 events as prior play.
