# Grounded adaptation of existing Lore, not a recovered original creation ask.
- id: taking-on-aruhe
  source_pages:
    - The Shattered Sea/Lore/Taking on Aruhe.md
    - The Shattered Sea/NPCs/Hinewai.md
  prompt: >-
    Flesh out Taking on Aruhe. I need to understand what causes the law,
    where its boundaries are and why survivors explain it differently.
    Give the Party ways to learn that through play, and show how someone
    on the island might use it to pressure them.
  checks:
    pages:
      - The Shattered Sea/Lore/Taking on Aruhe.md
    canon:
      The Shattered Sea/Lore/Taking on Aruhe.md:
        - '^type:\s*Lore\s*$'
  rubrics:
    - >-
      The explanation preserves the starting cause, claim-versus-receiving
      boundary, tells, duration, responders and practical exceptions. It
      clarifies ambiguous applications without replacing the cosmology,
      altering existing mechanics or promoting future destruction to history.
    - >-
      Accounts from relevant starting sources are attributed to their
      holders and distinguished from DM truth, with their distortions or
      gaps explained. Different survival practices remain recognisably
      different beliefs rather than copies of the authoritative explanation.
      Party knowledge follows played records, not future Prep.
    - >-
      Important conclusions have independent Clues in different places or
      interactions, saved on the real pages where the DM can run them.
      Essential understanding does not depend on one witness or roll.
      Spoken accounts are Player-safe and DM-facing truth stays separate.
    - >-
      A named actor uses the law through a plausible next move, observable
      signs and a Party lever. New Clues and pressure are prospective design,
      not already observed discoveries, and existing owner identities and
      Session history survive.

- id: il-gioco-festival
  source_pages:
    - The Shattered Sea/Lore/Il Gioco delle Beffe.md
    - The Shattered Sea/Locations/Calven and Calveno.md
  prompt: >-
    Flesh out Il Gioco delle Beffe so I can run this year's festival.
    Keep the five-day schedule, willing marks and scoring. Show how a
    team actually registers, how rival teams interfere, and how someone
    in Calveno would use a win to pressure the Party.
  checks:
    pages:
      - The Shattered Sea/Lore/Il Gioco delle Beffe.md
    canon:
      The Shattered Sea/Lore/Il Gioco delle Beffe.md:
        - '^type:\s*Lore\s*$'
  rubrics:
    - >-
      La Scelta, the Window and Il Giudizio survive with public schedule,
      willing marks, registered symbols and the recorded scoring split.
      Registration, rival interference and Beffa doppia are playable
      without replacing the full-truth numbers.
    - >-
      Named marks and places from the starting Wiki are reused. A named
      actor can spend festival social capital on the Party. New pressure
      is design; Session records of festival days already played stay
      history rather than being overwritten.
