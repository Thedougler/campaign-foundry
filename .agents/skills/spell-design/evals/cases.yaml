# Grounded adaptation: no original standalone Spell request was recovered.
- id: waveservant-boarding-spell
  source_pages:
    - The Shattered Sea/Deities/Umberlee.md
    - The Shattered Sea/NPCs/Umberlee - Branca.md
    - The Shattered Sea/Locations/Western Landing.md
  prompt: >-
    I want a Waveservant spell called Tribute Wake that briefly opens a
    safe boarding approach for a small rescue boat in rough water after
    tribute. Existing magic is fine if it fits. Otherwise make it feel
    like Umberlee's clergy, with someone who could teach it and a price.
  rubrics:
    - >-
      Actual retrieved spell candidates inform the choice. A published spell
      that fulfils the brief is reused unchanged without a redundant Wiki
      Spell page. If Tribute Wake needs distinct mechanics, comparable
      retrieved effects support its level and limits. Unavailable retrieval
      is reported honestly rather than proving no fitting spell exists.
    - >-
      The result provides a brief local boarding opening rather than
      command over the sea. A new Spell is saved with complete 2024 casting
      fields and usable effect, target, duration, scaling and counterplay
      where applicable. Likely rough-water and moving-boat situations can
      be adjudicated without improvising core limits.
    - >-
      Tradition and casting signature arise from the starting clergy and
      harbour practice. A resolving named source has a plausible reason to
      hold the magic, a discoverable path to learning it and a concrete price.
      Existing demands and unresolved debts are not waived; new teaching
      roles are distinguished from established history.
    - >-
      Any new Spell and necessary owners are complete saved artifacts;
      unchanged reuse instead gives usable access to the published rules.
      Neither branch records an unplayed lesson, tribute, casting or
      boarding, adds the Spell to a PC Sheet, or changes Umberlee's sourced
      reach at the elemental fissure.
