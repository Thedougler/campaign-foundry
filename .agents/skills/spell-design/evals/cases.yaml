# Grounded adaptation; no original standalone Spell request was recovered.
- id: spell
  source_pages:
    - shattered-sea/Deities/umberlee.md
    - shattered-sea/NPCs/umberlee-branca.md
    - shattered-sea/Locations/western-landing.md
  prompt: >-
    I want a signature Waveservant spell called Tribute Wake that briefly
    opens a safe boarding approach for a small rescue boat in rough water
    after tribute. Make it feel like Umberlee's clergy, with someone who
    could teach it and a price. Put the complete Spell in the Wiki, with
    its rules and something I can read out when it's cast.
  checks:
    pages:
      - shattered-sea/Spells/tribute-wake.md
    sections:
      shattered-sea/Spells/tribute-wake.md:
        - "## Rulings"
        - "## Tradition"
        - "## Who knows it"
        - "## Links"
    canon:
      shattered-sea/Spells/tribute-wake.md:
        - '^type:\s*Spell\s*$'
        - '^level: \d+'
        - '^school: \S'
        - '^classes:'
        - '\[!narration\] Casting'
  rubrics:
    - >-
      Tribute Wake is its own spell, doing what no published spell already
      does rather than renaming one: it opens a brief, local boarding chance
      for a small boat rather than command over the sea.
    - >-
      Tradition, casting signature and any price arise from Umberlee's
      clergy and harbour practice rather than generic water magic. A named
      teacher has a plausible reason to know the Spell, a discoverable path
      to learning it and a concrete price; who notices a first casting, and
      any rival use, create playable consequences.
    - >-
      The Spell is correct, complete and easy to run at the table from the
      page alone at its level: 2024 casting fields with clear targets,
      action cost, range, duration, concentration, tribute and scaling, and
      usable rulings for rough water, a moving boat and likely Player
      tricks.
    - >-
      Umberlee's existing demands, unresolved debts and reach at the
      elemental fissure remain intact. New rules and teaching roles read as
      design, not established history, and nothing unplayed (a lesson,
      tribute, casting or boarding) is recorded or added to a PC Sheet.
    - >-
      Casting lands in one hearing, with concrete visible form, scale
      against something familiar where relevant and a grounded sensory
      signature. It conveys the magic taking hold without naming a caster,
      Party or target, telling Players what their characters feel or do,
      exposing mechanics or secrets, or resolving the rescue before Players
      act.
