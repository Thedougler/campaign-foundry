# Grounded adaptation coverage; the original World-creation ask was not recovered.
- id: sourced-minimal-world
  source_pages:
    - The Shattered Sea/The Shattered Sea.md
    - The Shattered Sea/Locations/Calven and Calveno.md
  prompt: >-
    Create a new World called Shattered Sea Renewal, inspired by the Shattered
    Sea. Keep its maritime magic and technology, dangerous navigation, rival
    colonial powers, tribute, rescue and freedom themes. Start around a
    Calveno-like harbour and nearby island routes, with just enough people and
    powers to begin play later. Keep the dark heroic tone, with no sexual
    violence. You choose the new names and additional Deities, and design a
    complete Calendar starting in 1495 DR. Reuse the recorded cosmology and
    history where they fit. This is a World only, with no Campaign yet.
  checks:
    pages:
      - Shattered Sea Renewal/Shattered Sea Renewal.md
      - Shattered Sea Renewal/index.md
      - Shattered Sea Renewal/log.md
    sections:
      Shattered Sea Renewal/Shattered Sea Renewal.md:
        - '## At a glance'
        - '## Calendar'
        - '## Depth'
        - '## Links'
    canon:
      Shattered Sea Renewal/Shattered Sea Renewal.md:
        - '^type:\s*World\s*$'
      Shattered Sea Renewal/log.md:
        - '^## \[\d{4}-\d{2}-\d{2}\] create \| New World:'
  rubrics:
    - >-
      The supplied vision and creative delegation produce a usable Calendar,
      competing Faction wants and a compact connected starting region, without
      a redundant interview. Required sections contain runnable content at
      skeleton scale rather than a catalogue of future adventures.
    - >-
      Reused material is grounded in this run's retrieved Shattered Sea sources.
      Adapted names, Calendar and added Deities are new design, not claims about
      existing Shattered Sea Canon. Needed rules figures have complete owners
      and traceable retrieved sources or an explicit account of invention.
    - >-
      Three to five Factions, a handful of Locations and NPCs, a few Deities
      and two or three Lore pages form a linked skeleton with correct parents.
      Supporting owners serve that skeleton; Campaign content and empty future
      folders wait for later work. The source World and played records stay
      unchanged, and the creation log accounts for the new content.
