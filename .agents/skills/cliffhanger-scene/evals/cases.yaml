  rubrics:
    - >-
      The DM can run the crossing from positions, terrain and turn pressure.
      Swallowing, rescue, retreat and bypass remain contests with lasting
      costs. Bird behaviour and limits match this run's Creature owner rather
      than an invented fight-to-the-death script.
    - >-
      Incoming rescue state, including unrescued or carried civilians, changes
      who is at risk. Jean-Claude can act under the DM's awake override.
      Balance uses actual participating PCs and sourced 2024 Creature XP,
      naming over-budget risk instead of calling an excess force even. Spoken
      Narration puts the threat first and stops before it lands.
