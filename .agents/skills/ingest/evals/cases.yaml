# Ingests of real Archive inputs, asked as the DM hands them over.
- id: brain-dump
  source_pages:
    - shattered-sea/NPCs/cobb.md
  raw_sources:
    - archive/Cobb.md
  prompt: Ingest archive/Cobb.md.
  checks:
    canon:
      shattered-sea/log.md: ['/\] ingest \|/']
    # archive/Cobb.md is a legacy-vault export: its bare slug links and legacy citations are formatting, not Wiki text. Wiki links show their title, [[slug|Title]].
    absent:
      shattered-sea/NPCs/cobb.md:
        - '\[\[[a-z0-9]+(-[a-z0-9]+)+\]\]'
        - 'campaign-os:|vault/episodes|provenance:'
  rubrics:
    - Factual units reach their existing owner pages in the current template shape. Against this run's starting sources, Cobb remains the young rattkin dockworker and Nona's runner at La Vasca, with his childhood connection to Perrin.
    - Touched pages cite archive/Cobb.md while preserving existing provenance. The output contains no duplicate Cobb, file-summary page, legacy voice-profile page or executable copy of the Raw's UI widgets.
    - The three-day paint wait remains historical rather than replacing later refit and departure facts in the starting Wiki. Current Campaign state and PC levels are preserved.
    - Hidden loyalty and message limits remain DM knowledge. Cobb gains no unsupported combat statistics or Creature.
    - Only archive/Cobb.md is ingested. Touched pages and neighbours agree on the ingested facts.
    - Every subject archive/Cobb.md says something about beyond its name (Cobb, Nona Black-Jaw, Perrin, La Vasca, the Warren, Nona's sending stone, Uncertainty, Thunk) has the file's supportable claims on its owner page in the Outcome, whether this run changed that page or it already held them. No such claim is left unfiled.
    - Played records remain unchanged. The reply names actual changes and any real conflicts settled, without inventing a table ruling.
- id: transcript
  source_pages:
    - shattered-sea/Sessions/Session 11/session-11-recap.md
  raw_sources:
    - archive/session-11-transcript-archived-version.md
  prompt: Ingest archive/session-11-transcript-archived-version.md.
  checks:
    pages:
      - shattered-sea/Sessions/Session 11/session-11-recap.md
      - shattered-sea/Sessions/Session 12/session-12-previously-on.md
    sections:
      shattered-sea/Sessions/Session 11/session-11-recap.md:
        - '## At a glance'
        - '## What happened'
        - '## Changes'
        - '## Threads'
    # leftover-comment is a check finding: written pages that keep template %% guidance skipped the check gate.
    absent:
      shattered-sea/Sessions/Session 11/session-11-recap.md: ['%%']
      shattered-sea/Sessions/Session 12/session-12-previously-on.md: ['%%']
  rubrics:
    - The Recap accounts for every active Thread in this run's Campaign, including those that stayed still, and distinguishes played changes from unresolved pressures.
    - "Actual events follow the Session 11 Transcript: flight from the adult Bloodhawk, living fruit drawing hunters, Matteo's rescue from playful otters, ghost-plum invisibility, the Lesser Black Lotus drifting downstream and the unresolved Skarn attack. Unreached inland survivors and a completed theft are not narrated as played."
    - Jean-Claude, Matteo, Spinner custody and catatonia match this run's starting Wiki. The table's ambiguous attacker labels do not create a second attacker or override the Canon identity Skarn.
    - The Previously On comes from the full Transcript, told in the past tense with the Party as you, with concrete supported acts for Delmar, Perrin and Crissdalynn. Jean-Claude is represented through his recorded state, not assigned an action he never took. It ends where that Transcript stops, with Skarn still in Crissdalynn's face, and tells nothing after that stop.
    - Quoted table speech is word-for-word from the Transcript. Narrative events and character reactions are supported by it, rather than invented to complete an arc.
    - "Table talk is not play: Delmar's unrealised plan to carry Jean-Claude back to the ship and fire its cannons at the Bloodhawk, and the joke about hitting the bird with a shark, are not recorded as played or as settled intent on any page."
    - Both regenerated records cite archive/session-11-transcript-archived-version.md. Other played records, Session 11's Previously On included, stay unchanged; Session 12 outcomes and later rewards remain plans.
    - Only that Transcript is ingested. Touched pages and neighbours agree with the Transcript and later Canon; hot, PC levels and the uncertain 1495 DR date remain consistent with this run's starting state.
    - The reply asks the DM nothing and reports no unit, page, Fill or check as skipped, deferred, left for later or awaiting approval.

# A file about an already-played Session that is not its Transcript: a legacy session recap re-ingested over existing Session records.
- id: legacy-session-record
  source_pages:
    - shattered-sea/Sessions/Session 2/session-2-recap.md
    - shattered-sea/Sessions/Session 2/session-2-previously-on.md
    - shattered-sea/NPCs/ket.md
    - shattered-sea/NPCs/barnaby-rook.md
    - shattered-sea/NPCs/beaumont-sel.md
    - shattered-sea/NPCs/shepherd-grigori.md
    - shattered-sea/Vehicles/uncertainty.md
  raw_sources:
    - archive/session-02-recap.md
  prompt: Ingest archive/session-02-recap.md.
  checks:
    canon:
      shattered-sea/Sessions/Session 2/session-2-recap.md:
        - 'suffered three hull strikes from below in a tropical storm'
      shattered-sea/Sessions/Session 2/session-2-previously-on.md:
        - 'named a prize crew before three impacts from below turned the cutter in a storm'
      shattered-sea/log.md: ['/\] ingest \|/']
    absent:
      shattered-sea/NPCs/ket.md: ['\[\[[a-z0-9]+(-[a-z0-9]+)+\]\]']
      shattered-sea/NPCs/barnaby-rook.md: ['\[\[[a-z0-9]+(-[a-z0-9]+)+\]\]']
      shattered-sea/NPCs/beaumont-sel.md: ['\[\[[a-z0-9]+(-[a-z0-9]+)+\]\]']
      shattered-sea/Vehicles/uncertainty.md: ['\[\[[a-z0-9]+(-[a-z0-9]+)+\]\]']
  rubrics:
    - Session 2's Recap and Previously On stay the played record as they stood; the run writes no new Recap, Previously On or file-summary page for Session 2.
    - "Each subject the file says something about beyond its name (Barnaby Rook, Ensign Wouters, Ket, Beaumont Sel, Shepherd Grigori, the prize crew, the HCS Surety later renamed Uncertainty, the unresolved strikes from below) has the file's played facts on its owner page in the Outcome, whether this run changed that page or it already held them. No such claim is left unfiled and no duplicate page is created."
    - Hidden truths the file keeps from the Players (Simone's supply chain behind the Grung vials, Grigori's nature) stay DM-facing on their pages and do not surface in Narration.
    - Links on touched pages target current Wiki pages by slug and show their title or a custom label (`[[slug|Title]]`). The file's legacy frontmatter (provenance scores, relationships, tier, visibility) and its next-session pointer are not carried onto any page.
    - The reply asks the DM nothing and reports no unit, page or check as skipped, deferred or awaiting approval.

- id: the-mortis
  source_pages:
    - shattered-sea/the-shattered-sea.md
    - shattered-sea/shattered-sea.md
  raw_sources:
    - archive/mortis.md
    - archive/mortis-dm-guide.md
  prompt: >-
    Ingest archive/mortis.md as the table House Rule. The DM notes are
    archive/mortis-dm-guide.md.
  checks:
    pages:
      - shattered-sea/House Rules/the-mortis.md
    canon:
      shattered-sea/House Rules/the-mortis.md:
        - '^type:\s*House Rule\s*$'
        - Mark
        - Gift
      shattered-sea/log.md: ['/\] ingest \|/']
    absent:
      shattered-sea/House Rules/the-mortis.md: ['%%']
  rubrics:
    - >-
      The player-facing Mortis from archive/mortis.md is a World House
      Rule: optional at character creation, a Mark and Gift as two sides of
      one fact, one Mortis per character, standard-rules expression that
      fits a line on the sheet, rebalance once in the first few sessions
      then locked, and a +2 ability-score Gift that cannot raise a score
      above 20. The Gift is a modest reward worth a little more than the
      Mark, not a punishment and not extra table delay.
    - >-
      Creation is runnable: the player names the flaw, the DM writes the
      Mark and proposes a Gift, both agree, DM has final say. DM-guide
      calibration (avoidable checks versus forced saves, complex Gifts only
      for forced Marks with pre-written triggers) stays DM-facing Depth or
      a linked House Rule, not Player-facing dump.
    - >-
      Party examples from the DM guide, if used, remain examples on the
      House Rule. PC Sheets are not rewritten. The rule is homebrew, not a
      published 2024 variant. Both archive files are cited as sources; the
      reply names the House Rule page.

- id: bloodhawk-token
  source_pages:
    - shattered-sea/Creatures/bloodhawk.md
  raw_sources:
    - archive/bloodhawk-foundry-token.jpg
  prompt: Ingest archive/bloodhawk-foundry-token.jpg as the Bloodhawk token.
  checks:
    pages:
      - shattered-sea/Creatures/bloodhawk.md
    canon:
      shattered-sea/Creatures/bloodhawk.md:
        - '^type:\s*Creature\s*$'
        - '/!\[\[Bloodhawk/'
      shattered-sea/log.md: ['/\] ingest \|/']
  rubrics:
    - >-
      The archived Foundry token is embedded on the existing Bloodhawk
      Creature as its token image. Statistics, role and other art on that
      page survive.
    - >-
      No second Bloodhawk Creature is created. Played records stay
      unchanged. The reply names the Creature page and where the image file goes.
