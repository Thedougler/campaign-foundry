    - The notes file is in archive/, raw/ is empty, no page summarises the notes file itself, and the whole-Wiki gate passes.
- id: transcript
  prompt: Session 3's Transcript is in raw. Ingest it.
  checks:
    pages: [Lowtide/Campaigns/Salt and Lantern/Sessions/Session 3/Session 3 - Recap.md, Lowtide/Campaigns/Salt and Lantern/Sessions/Session 3/Session 3 - Previously On.md]
    canon:
      Lowtide/NPCs/Hobb Tarrow.md: [Ada Tarrow]
      Lowtide/log.md: ['/\] ingest \|/']
  rubrics:
    - The Session 3 Recap records what happened (Hobb reads the page, the Council meeting, the vote for a dawn reading, the intercepted note) and what changed, and moves each Thread it touched.
    - The DM's table ruling (Hobb's grandmother was Ada Tarrow, a ferry captain) is filed on Hobb's page as Canon.
    - Maud Averill has an NPC page, and Ossie is recognised as a Reedrunner messenger from Tidewell even though no page existed for him before.
    - The Previously On is read-aloud Narration built on the table's moments (the stolen Council sugar on a natural 20, Brannoch's hand on the ledger, Tamsin grabbing Ossie), in past tense, ending inside the moment play stopped.
    - hot.md is rewritten for the state after Session 3 (the dawn reading, the note), within the gate's cap.
    - The Transcript is in archive/, the audit ran over the touched pages, and the whole-Wiki gate passes.
