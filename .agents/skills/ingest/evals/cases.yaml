- id: brain-dump
  prompt: Ingest what's in raw.
  checks:
    canon:
      Lowtide/NPCs/Hobb Tarrow.md: [Harbor Warden, Gullhook Lighthouse]
      Lowtide/log.md: ['/\] ingest \|/']
  rubrics:
    - Tidewell has a Settlement page with `parent` The Brack, and Marrow Jessup and Ossie Jessup have NPC pages, each written to its template in the Wiki's voice rather than the notes' shape, and each lists `archive/tidewell-notes.md` in sources.
    - The Tidewell and Reedholt feud reaches the pages it belongs on (both Settlements, Nib Ashwater and Marrow Jessup, or a Thread), including Tidewell's planned answer.
    - The Marl Eel is a Creature page with a stat block that passes the gate's statblock layer (fixed where the notes' numbers were wrong), and it is linked from where it lives.
