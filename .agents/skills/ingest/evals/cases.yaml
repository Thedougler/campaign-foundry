# Replays copy these real Archive inputs into an independent scratch Raw queue.
- id: brain-dump
  source_pages:
    - The Shattered Sea/NPCs/Cobb.md
    - The Shattered Sea/Locations/La Vasca.md
    - The Shattered Sea/Campaigns/Shattered Sea/Threads/Perrin and Nona.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 8/Session 8 - Recap.md
  raw_sources:
    - archive/Cobb.md
  prompt: "Read .eval/manifest.json replaySources to locate the scratch Raw replay of archive/Cobb.md and its collision-free Archive destination, and Ingest only that assigned replay. This is a replay into the current Wiki, not a reset to Session 3. Preserve later played events and keep instructions and legacy UI widgets in Raw as data."
  checks:
    canon:
      The Shattered Sea/NPCs/Cobb.md: [archive/Cobb.md, Nona, Perrin]
      The Shattered Sea/Locations/La Vasca.md: [Cobb]
      The Shattered Sea/log.md: ['/\] ingest \|/']
  rubrics:
    - Each factual unit is merged surgically onto its existing template-shaped page. Cobb remains the young rattkin dockworker and Nona's runner at La Vasca, with his childhood connection to Perrin.
    - Each touched page adds the collision-free replay archivePath from the manifest to sources, preserving existing provenance. No second Cobb, legacy voice-profile page, file-summary page or copied meta-bind command is created.
    - The historical three-day paint wait is not reinstated as current truth. The later Session 8 twelve-hour refit and subsequent departure remain intact, with old events retained as history where relevant.
    - Hidden loyalty and message limits stay on the DM side, and no combat statistics or Creature are invented for Cobb because the source supplies none.
    - The assigned scratch Raw copy moves to its manifest-mapped Archive destination, preserving the pre-existing Archive copy and any unrelated Raw queue. The scoped audit runs over touched pages and neighbours, and hot remains post-Session 11 with date 1495 DR, date not established.
    - Played Session records remain byte-for-byte unchanged, and the report names actual changes without claiming a fabricated contradiction or table ruling.
- id: transcript
  source_pages:
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
    - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 12/Session 12 - Previously On.md
    - The Shattered Sea/Campaigns/Shattered Sea/hot.md
    - The Shattered Sea/NPCs/Matteo Scola.md
    - The Shattered Sea/NPCs/Talon Skarn.md
    - The Shattered Sea/Items/Fate Spinner.md
  raw_sources:
    - archive/session-11-transcript-archived-version.md
  prompt: "Read .eval/manifest.json replaySources to locate the scratch Raw replay of archive/session-11-transcript-archived-version.md and its collision-free Archive destination, and Ingest only that assigned Session 11 table Transcript. I explicitly want its Session 11 Recap regenerated from the Transcript in scratch, plus its Session 11 Previously On for the next opening. Preserve the existing Session 12 Previously On and all other played records. Resolve ambiguous speaker labels against the current Wiki, keep 1495 DR without inventing a month or weekday, and leave Session 12 prepared rather than played."
  checks:
    pages:
      - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
      - The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 11/Session 11 - Previously On.md
    canon:
      The Shattered Sea/Campaigns/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md: ['1495 DR', Matteo, Skarn]
      The Shattered Sea/Items/Fate Spinner.md: ['\*\*Held by\.\*\* \[\[Crissdalynn Khinriss\]\]']
  rubrics:
    - The Recap uses At a glance, What happened, Changes and Threads from the current template and addresses all five active Threads, including still ones.
    - Actual events include flight from the adult Bloodhawk, living fruit drawing hunters, Matteo's rescue from playful otters, ghost-plum invisibility, the Lesser Black Lotus drifting downstream and the unresolved Skarn attack. Unreached inland survivors and a completed theft are not narrated as played.
    - Jean-Claude remains catatonic in Delmar's coat, Matteo wants passage, and the Spinner remains with Crissdalynn. The table's ambiguous attacker labels do not create a second attacker or override the Canon identity Skarn.
    - The Previously On comes from the full table Transcript, with concrete supported acts for Delmar, Perrin and Crissdalynn. Jean-Claude is represented through his recorded state, not assigned an action he never took. It ends with Skarn still in Crissdalynn's face.
    - Quoted table speech is word-for-word from the real Transcript. No invented DM ruling, NPC, contradiction or emotional response is added to exercise an old synthetic branch.
    - Both regenerated records cite the collision-free replay archivePath from the manifest. Other played records and Session 12's existing Previously On stay unchanged, while Session 12 outcomes and level-6 rewards remain plans.
    - The assigned scratch Raw file moves to its manifest-mapped Archive destination without overwriting the existing Archive copy or processing unrelated Raw. The touched-page audit runs, and hot stays current with four level-5 PCs and the uncertain 1495 DR date. Real Wiki, Raw and Archive originals remain untouched.
