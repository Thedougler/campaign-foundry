# Replays of real Archive inputs; preparation supplies the Raw paths and destinations.
- id: brain-dump
  source_pages:
    - The Shattered Sea/NPCs/Cobb.md
  raw_sources:
    - archive/Cobb.md
  prompt: Ingest archive/Cobb.md.
  checks:
    canon:
      The Shattered Sea/log.md: ['/\] ingest \|/']
  rubrics:
    - Factual units reach their existing owner pages in the current template shape. Against this run's starting sources, Cobb remains the young rattkin dockworker and Nona's runner at La Vasca, with his childhood connection to Perrin.
    - Touched pages cite the assigned Archive destination while preserving existing provenance. The output contains no duplicate Cobb, file-summary page, legacy voice-profile page or executable copy of the Raw's UI widgets.
    - The three-day paint wait remains historical rather than replacing later refit and departure facts in the starting Wiki. Current Campaign state and PC levels are preserved.
    - Hidden loyalty and message limits remain DM knowledge. Cobb gains no unsupported combat statistics or Creature.
    - The Raw copy reaches its assigned Archive destination without overwriting the original or processing unrelated Raw. Touched pages and neighbours agree on the ingested facts.
    - Played records remain unchanged. The reply names actual changes and any real conflicts settled, without inventing a table ruling.
- id: transcript
  source_pages:
    - The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
  raw_sources:
    - archive/session-11-transcript-archived-version.md
  prompt: Ingest archive/session-11-transcript-archived-version.md.
  checks:
    pages:
      - The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
      - The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Previously On.md
    sections:
      The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md:
        - '## At a glance'
        - '## What happened'
        - '## Changes'
        - '## Threads'
  rubrics:
    - The Recap accounts for every active Thread in this run's Campaign, including those that stayed still, and distinguishes played changes from unresolved pressures.
    - "Actual events follow the assigned Session 11 Transcript: flight from the adult Bloodhawk, living fruit drawing hunters, Matteo's rescue from playful otters, ghost-plum invisibility, the Lesser Black Lotus drifting downstream and the unresolved Skarn attack. Unreached inland survivors and a completed theft are not narrated as played."
    - Jean-Claude, Matteo, Spinner custody and catatonia match this run's starting Wiki. The table's ambiguous attacker labels do not create a second attacker or override the Canon identity Skarn.
    - The Previously On comes from the full assigned Transcript, with concrete supported acts for Delmar, Perrin and Crissdalynn. Jean-Claude is represented through his recorded state, not assigned an action he never took. It ends where that Transcript stops, with Skarn still in Crissdalynn's face.
    - Quoted table speech is word-for-word from the assigned Transcript. Narrative events and character reactions are supported by it, rather than invented to complete an arc.
    - Both regenerated records cite the assigned Archive destination. Other played records and Session 12's existing Previously On stay unchanged; Session 12 outcomes and later rewards remain plans.
    - The Raw copy reaches its assigned Archive destination without overwriting the original or processing unrelated Raw. Touched pages and neighbours agree with the Transcript and later Canon; hot, PC levels and the uncertain 1495 DR date remain consistent with this run's starting state.

- id: the-mortis
  source_pages:
    - The Shattered Sea/The Shattered Sea.md
    - The Shattered Sea/Shattered Sea/Shattered Sea.md
  raw_sources:
    - archive/mortis.md
    - archive/mortis-dm-guide.md
  prompt: >-
    Ingest archive/mortis.md as the table House Rule. The DM notes are
    archive/mortis-dm-guide.md.
  checks:
    pages:
      - The Shattered Sea/House Rules/The Mortis.md
    canon:
      The Shattered Sea/House Rules/The Mortis.md:
        - '^type:\s*House Rule\s*$'
        - Mark
        - Gift
      The Shattered Sea/log.md: ['/\] ingest \|/']
  rubrics:
    - >-
      The player-facing Mortis from the assigned Archive is a World House
      Rule: optional at character creation, a Mark and Gift as two sides of
      one fact, one Mortis per character, standard-rules expression that
      fits a line on the sheet, rebalance once in the first few sessions
      then locked, and a +2 ability-score Gift that cannot raise a score
      above 20. The Gift is a modest reward worth a little more than the
      Mark, not a punishment and not extra table delay.
    - >-
      Creation is runnable: the player names the flaw, the DM writes the
      Mark and proposes a Gift, both agree, DM has final say. DM-guide
      calibration (avoidable checks versus forced saves, complex Gifts only
      for forced Marks with pre-written triggers) stays DM-facing Depth or
      a linked House Rule, not Player-facing dump.
    - >-
      Party examples from the DM guide, if used, remain examples on the
      House Rule. PC Sheets are not rewritten. The rule is homebrew, not a
      published 2024 variant. Both Raws reach Archive destinations; the
      reply names the House Rule page.

- id: bloodhawk-token
  source_pages:
    - The Shattered Sea/Creatures/Bloodhawk.md
  raw_sources:
    - archive/bloodhawk-foundry-token.jpg
  prompt: Ingest archive/bloodhawk-foundry-token.jpg as the Bloodhawk token.
  checks:
    pages:
      - The Shattered Sea/Creatures/Bloodhawk.md
    canon:
      The Shattered Sea/Creatures/Bloodhawk.md:
        - '^type:\s*Creature\s*$'
        - '/!\[\[Bloodhawk/'
      The Shattered Sea/log.md: ['/\] ingest \|/']
  rubrics:
    - >-
      The assigned Foundry token reaches the existing Bloodhawk Creature as
      its token image, with the Raw copied to its Archive destination.
      Statistics, role and other art on that page survive.
    - >-
      No second Bloodhawk Creature is created. Played records stay
      unchanged. The reply names the Creature page and image destination.
