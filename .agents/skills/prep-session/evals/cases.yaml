  prompt: >-
    Finish the full unplayed Session 12 Prep from this settled intent: a
    four-hour Aruhe rescue continuing the actual last played camp, with Dawn
    Strike, The Smoking Skylight, Terror-Birds, Orders in the Ash, Consume and
    The Way Out as the planned route. Keep the source's locations, law,
    opposition goals and rescue objective; the chart is pressure, not required
    victory. Perrin's choice to consume is central and he may refuse. Jean-Claude
    remains catatonic unless play changes it; his Spotlight must not assume
    recovery. Skarn's dawn capture, theft, retreat or defeat must genuinely
    affect dusk. Give every PC a meaningful opportunity, an independent
    opposition timeline, about ten distributed true Clues and multiple routes
    to essential conclusions. Reuse fitting cast first. This is complete
    Session Prep: fill all Scenes, supply missing required images, rewrite hot
    without asserting future events, index/log/full gate, then actual offline
    Push. Keep played Session records and heard Narration intact. All intent
    is settled; choose remaining design details consistently with Canon and
    report any actual external capability or packing prerequisite you cannot
    satisfy, never fake an image or successful Push.
