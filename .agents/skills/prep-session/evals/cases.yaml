  rubrics:
    - >-
      The revised Prep and linked Scenes form a runnable four-hour Session:
      an immediate opening, alternating discovery and physical pressure,
      an earned Climax and a short aftermath. Each Scene offers decisions,
      rulings and a coherent continuation. Smoke and recovering survivors
      drive progress; the session is not replaced by unrelated plot or
      repeated NPC-only contests.
    - >-
      Jean-Claude can participate under the DM's explicit awake override
      without a fabricated cure or rewritten prior play. Every current PC
      has a meaningful opportunity grounded in this run's starting goals
      and bonds. The order chain and Hinewai's prejudice distinguish compelled
      history from personal guilt. Essential conclusions have independent
      discovery routes, with source-grounded Clues usable in multiple Scenes.
    - >-
      Skarn's current loyalty and theft objective remain intact. The later
      invisible attempt follows the retrieved Ghost Plum rules and the
      first attempt's actual possible outcomes; capture, death or a completed
      theft changes the later premise. CONSUME offers useful power at a real
      source-grounded cost, with refusal playable. Spinner ownership,
      survivor losses and expended resources carry through the endings.
    - >-
      The DM can run the reachable Encounters from sourced 2024
      participating-PC budgets, Creature embeds, terrain and contestable
      opposition tactics. Reused rules and cast agree with this run's owner
      pages. Planned outcomes remain conditional in hot and elsewhere;
      played records remain intact. The saved reply accounts honestly for
      completion and any unavailable images or Push prerequisites rather
      than claiming generated assets or a build that did not happen.
