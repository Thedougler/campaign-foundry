  rubrics:
    - >-
      The final Scene Chart starts with Hook, alternates Development and
      Cliffhanger middle slots, and ends Climax then Resolution. Table Minutes
      fit the actual four-hour budget, and each linked Scene has executable
      triggers, pressure, choices, rulings and incoming/outgoing alternatives.
      Each opposition move has an independent clock, visible sign and
      interference consequence. The first contest rewards sound play; the
      highest stakes are earned in the Climax, not repeated mandatory fights.
    - >-
      About ten concrete source-grounded Clues are actually discoverable in
      multiple Scenes, with three independent routes to necessary conclusions.
      All PC Spotlights arise from retrieved goals or bonds and affect a Thread
      touched in the Climax. Jean-Claude's current incapacity affects actual
      participation, not an invented recovery. Conditional loss of civilians,
      Spinner ownership, Skarn status and Perrin refusal persist into later
      entries and Resolution. Narration stops at Player decisions.
    - >-
      Needed cast and rules owners are complete and reused first. Every possible
      fighting force has sourced 2024 participating-PC budget and raw-XP
      arithmetic, actual statblock embeds and tactical qualification. The
      final full gate, accurate hot, index and complete prep log are observed;
      played records remain intact. Required missing images are real verified
      assets, and a non-dry-run offline Push or up-to-date result is observed.
      Named missing prerequisites remain failures of this complete-Prep
      criterion rather than passes or placeholder work.
