  rubrics:
    - >-
      The Prep, complete chart, Previously On and linked Scenes form a
      runnable four-hour Session from the Wiki alone: an immediate Hook,
      alternating discovery and physical pressure, an earned Climax and a
      short aftermath, with time for breaks and lookups. Every Scene has
      decisions, rulings and coherent conditional continuations. The cast is
      resolved through usable owners and embeds, and smoke and recovering
      survivors drive progress rather than unrelated plot or NPC-only contests.
    - >-
      Every participating PC has a meaningful opportunity grounded in current
      goals and bonds. Opposition advances on its own runnable timeline;
      source-grounded Clues work in multiple Scenes and essential conclusions
      have independent discovery routes. The order chain and Hinewai's
      prejudice distinguish compelled history from personal guilt through
      specific people, evidence and choices rather than an explanatory lecture.
    - >-
      Jean-Claude acts under the awake override without a fabricated cure or
      rewritten prior play. Skarn's loyalty and theft objective remain intact,
      and the later attempt changes or disappears when the first attempt's
      outcomes prevent it. CONSUME offers useful power at a source-grounded
      cost with playable refusal. Spinner ownership, survivor losses and spent
      resources carry through all endings; planned outcomes stay conditional
      in Prep, Scenes, hot and owner pages while played records remain intact.
    - >-
      Reachable Encounters and reused effects are source-correct under 2024
      5e, with actual participating-PC budgets, Creature embeds, usable terrain
      and contestable tactics. Cast, fruit rules, rewards and advancement
      agree with their owners. The reply honestly accounts for text completion,
      images, gate and Push results or unavailable prerequisites rather than
      claiming assets, validation or a build that did not happen.
    - >-
      All Scene Openings, Revelations, transitions and Closing images meet
      theatre-of-the-mind standard: speakable after one hearing, concrete
      physical form and scale against familiar things, grounded sensory and
      spatial detail, and branch-correct visible facts. Live events stop
      before Players act; mechanics, secrets and PC feelings or decisions
      stay out of spoken text. Previously On recounts only sourced played
      events, ends on the actual unresolved Skarn attack and prepares the
      Players to resume rather than narrating future Prep as history.
