  prompt: >-
    Prep Session 12 from the top, keeping the broad shape of the existing
    plan. We've settled on four hours following the other survivors' smoke
    into Aruhe. Jean-Claude is awake; his Player was only absent last time.
    Skarn wants the Spinner for Vantyrus and is loyal now, then makes another
    attempt later after eating a fallen Ghost Plum. At that moment Auralis
    tells Perrin CONSUME beside living Giant's Guava. Perrin can choose the
    power and the island's wrath. The two-grave orders and Hinewai's
    prejudice bring obedience and inherited guilt into it. Make this ready
    to run, with rescuing the survivors still the main driver.
