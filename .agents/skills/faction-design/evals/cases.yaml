  prompt: >-
    Deepen the Dravosi Crown into an opposition Faction I can run while the
    Party is on Aruhe. The Party captured HCS Surety as Uncertainty and holds
    Rook's Letters of Marque; Crown pursuit continued after the Ordinance
    deception. Give the Crown faces, an exploitable fracture and custom,
