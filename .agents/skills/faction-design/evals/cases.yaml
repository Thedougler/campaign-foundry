# Default: grounded adaptation of the existing Crown pursuit, not recovered creation history.
- id: faction
  source_pages:
    - shattered-sea/Factions/dravosi-crown.md
    - shattered-sea/Threads/the-crown-inspection.md
    - shattered-sea/NPCs/rupert-knighton.md
    - shattered-sea/NPCs/corbin-knighton.md
    - shattered-sea/Vehicles/uncertainty.md
    - shattered-sea/Locations/calven-and-calveno.md
    - shattered-sea/hot.md
    - shattered-sea/PCs/crissdalynn-khinriss.md
    - shattered-sea/PCs/delmar-fisk.md
    - shattered-sea/PCs/jean-claude-tabarnack.md
    - shattered-sea/PCs/perrin-black-jaw.md
  prompt: >-
    Deepen the Dravosi Crown as opposition while the crew is on Aruhe.
    Give me people I can put in front of them, divisions they can exploit
    and an offer that might tempt them. What does the Crown do next if
    they keep ignoring the pursuit? Make the whole faction page and its
    agenda ready to run, including what I read when the crew first meets
    Crown people at work.
  checks:
    pages:
      - shattered-sea/Factions/dravosi-crown.md
      - shattered-sea/Threads/the-crown-inspection.md
    sections:
      shattered-sea/Factions/dravosi-crown.md:
        - '## At a glance'
        - '## Play'
        - '## Depth'
        - '### History'
        - '### Hidden truths'
        - '### Threads'
        - '## Links'
      shattered-sea/Threads/the-crown-inspection.md:
        - '## At a glance'
        - '## Play'
        - '## Depth'
        - '## Links'
    canon:
      shattered-sea/Factions/dravosi-crown.md:
        - '^type:\s*Faction\s*$'
        - '^>\s*\[!narration\]\s+Public face\s*$'
      shattered-sea/Threads/the-crown-inspection.md:
        - '^type:\s*Thread\s*$'
        - '^status:\s*active\s*$'
    absent:
      shattered-sea/Factions/dravosi-crown.md:
        - '^```statblock\b'
  rubrics:
    - >-
      The Crown is a specific, usable institution rather than interchangeable
      opposition. Its concrete goal, signature method, base, resources and
      collision with named powers explain why it acts now. A decision-maker
      and two or three accessible faces have resolving NPC pages and personal
      wants not identical to the institution's; a recognisable custom and
      internal fracture give the Party practical leverage rooted in Crown
      law, naval work, oaths or competing authority.
    - >-
      Play is runnable from the Faction and its linked owners: an offerer,
      benefit and catch fit the actual Party's goals, papers and captured
      vessel. Meeting, opposition, inaction and a broken deal each have
      concrete responses and costs. A hidden truth can change the deal and
      has three independent, placed Clues of different kinds; information,
      tasking, payment and access can be used rather than merely described.
    - >-
      Three to five future milestones advance the existing Crown Inspection
      Thread without duplicating the agenda or reopening the resolved boarding.
      Each has a relative time or trigger, an observable advance sign, a
      changed fact and Party levers; the first matters by the next Session
      and completion has a clear consequence. Pursuit and escalation obey
      the live sources' resources and officers' distinct knowledge, including
      the difference between ordinary crime and confirmed heresy.
    - >-
      Existing relationships, owner identities, Session history and current
      Party state survive; new pressure is design, not a played seizure or
      newly shared secret. Fighting ranks have usable counts and Creature
      owners, and added mechanical opposition is correct under 2024 5e and
      applicable House Rules and calibrated to the actual Party, with warning
      and off-ramps for overwhelming forces. The offer and agenda do not
      require a forced fight, scripted theft or predetermined Party choice.
    - >-
      Public face is speakable after one hearing and shows Crown people
      doing recognisable work in the Party's frame, with concrete bodies,
      equipment or hulls at familiar scale, a usable custom and a visible
      trace of their presence. The public name lands naturally instead of
      an exposition dump. Secret plans and mechanics stay DM-facing; the
      text assigns no PC feeling or action and stops before Players act.
