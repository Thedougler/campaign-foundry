# Grounded adaptation of the existing Crown pursuit, not recovered creation history.
- id: crown-pursuit
  source_pages:
    - The Shattered Sea/Factions/Dravosi Crown.md
    - The Shattered Sea/Shattered Sea/Threads/The Crown Inspection.md
  prompt: >-
    Deepen the Dravosi Crown as opposition while the crew is on Aruhe.
    Give me people I can put in front of them, divisions they can exploit
    and an offer that might tempt them. What does the Crown do next if
    they keep ignoring the pursuit?
  checks:
    pages:
      - The Shattered Sea/Factions/Dravosi Crown.md
      - The Shattered Sea/Shattered Sea/Threads/The Crown Inspection.md
    canon:
      The Shattered Sea/Factions/Dravosi Crown.md:
        - '^type:\s*Faction\s*$'
  rubrics:
    - >-
      The Crown's inspection-law goal and relationships with existing powers
      create concrete stakes. Accessible faces have resolving NPC owners;
      internal divisions and customs are levers grounded in its institutions,
      authority and interests rather than interchangeable Faction colour.
    - >-
      The offer names an offerer, benefit and catch relevant to the actual
      Party's goals, papers and captured vessel. Meeting, opposition,
      inaction and a broken deal have usable consequences. Hidden truths have
      independent evidence, and public knowledge remains separate from
      private officers' knowledge in the frozen starting sources.
    - >-
      Future pursuit uses the existing Crown Inspection Thread without
      reopening the resolved boarding or duplicating the agenda. Moves have
      relative times or triggers, observable signs, stakes and ways for the
      Party to interrupt them. Resources and escalation follow the starting
      Crown's limits, including the distinction between crime and heresy.
    - >-
      Fighting ranks link Creature owners rather than copying statblocks.
      New pressure is design, not a played encounter, completed seizure or
      newly shared secret. Existing Session history and current Party state
      remain consistent with the frozen sources.

- id: countless-hunt
  source_pages:
    - The Shattered Sea/Factions/Countless.md
    - The Shattered Sea/Items/Fate Spinner.md
    - The Shattered Sea/Shattered Sea/Quests/Rule of Two.md
  prompt: >-
    Deepen Countless's hunt for the Fate Spinner. I need faces the Party
    can meet on pilgrim routes, how a one-job blade is actually tasked,
    and what happens if they keep the Spinner while ignoring the Talons.
  checks:
    pages:
      - The Shattered Sea/Factions/Countless.md
    canon:
      The Shattered Sea/Factions/Countless.md:
        - '^type:\s*Faction\s*$'
  rubrics:
    - >-
      The hunt stays Countless: one-job agents, taken names, Vantyrus
      leading, Skarn serving now. Accessible faces have NPC owners.
      Tasking, payment and missing-name concealment are runnable.
    - >-
      Ignoring the hunt has observable next pressure without completing
      Rule of Two or Skarn's succession. Hidden Spinner-gift aims stay
      DM-facing. New pressure is design, not a played theft or Session 11
      rewrite.
