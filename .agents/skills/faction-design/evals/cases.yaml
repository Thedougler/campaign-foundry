  rubrics:
    - >-
      The Crown's inspection-law want and collision with Passage or Tessarine
      have concrete current stakes and resolving pages. The existing pursuit
      Thread is reused without reopening the completed boarding or creating a
      duplicate agenda. Three to five future milestones each have a relative
      time or trigger, observable sign, changed fact and Party interruption;
      the first matters soon without inventing a month or weekday in 1495 DR.
    - >-
      Leadership and accessible faces resolve to actual NPC pages; Corbin and
      Rupert's unequal information is preserved. Corbin has privately recognised
      the alias but withheld his correction; Rupert's ships followed the false
      Calveno trail and he has not learned Rook's fate. Public service knowledge
      does not silently include the living-chart secret. Confirmed heresy, not
      ordinary crime, is the threshold for Malone.
    - >-
      The custom and internal fracture are usable levers grounded in Crown
      paperwork, authority and competing interests, not interchangeable faction
      colour. Meeting, opposition, ignored pressure and a broken deal have
      concrete consequences. An offer names an actual offerer, pay and catch
      relevant to the real Party's current goals and papers; hidden truth has
      three distinct discoverable Clues.
    - >-
      The Faction and Thread use their actual Wiki templates and resolving
      owner links, with fighting ranks counted and linked to Creatures rather
      than copied statistics. New design decisions are separated from sourced
      facts. The full scratch-root gate and one create log cover every touched
      page; hot and Session records remain unchanged.
