  rubrics:
    - >-
      The DM can run a non-action turn that changes what the Party knows,
      can reach or can choose. NPC wants, knowledge, offers and responses to
      help or refusal support distinct approaches to the tube rescue and
      onward lead. Essential conclusions have independent discovery routes
      and remain available when an optional check fails or rescue is refused;
      physical danger from the bird hands to the action Scene.
    - >-
      The page's uncertain climbing, hauling, treatment and preparation
      actions have complete, source-correct 2024 rulings, action or time costs
      and consequences. Straightforward examination and willing answers
      deliver information without a needless roll, and useful preparation
      gives a concrete, supported edge in the receiving contest.
    - >-
      Incoming Dawn Strike results remain in force instead of restoring lost
      people, the Spinner or spent resources. Jean-Claude can participate
      under the DM's awake override without a fabricated recovery. Clues,
      cast and reusable effects agree with their retrieved Canon owners;
      rescues and later outcomes are design alternatives, not played events.
    - >-
      Smoke, the trapped survivors and their relationships make the rescue
      the specific driver rather than an interchangeable quest briefing.
      The Scene gives the present PCs meaningful opportunities and an
      actionable north-east lead, with a clear pressure that ends circular
      talk and carries different choices and costs into the next Scene.
    - >-
      The Opening and any Revelation or transition are speakable after one
      hearing, with sourced, perceivable detail, concrete physical form and
      scale against familiar things, clear placement and an information
      source the Players can act on. Hidden answers and mechanics stay in DM
      notes; live events stop before Players must respond, and no PC action,
      feeling or thought is assigned by the Narration.
