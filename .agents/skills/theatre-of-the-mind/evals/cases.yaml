      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Previously On.md:
        - '^>[ \t]*\[!narration\][^\n]*\n(?:>[^\n]*\n)*>[^\n]*;'
  rubrics:
    - >-
      Skarn First look: grounded cues from this run's starting NPC page, one
      distinctive feature beside one behaviour, complete spoken line preserved
      from that page, three to five sentences plus the line, second person
      present, no prescribed PC action. Secrets stay off the spoken block.
      Rest of the NPC page unchanged.
    - >-
      Dawn Strike Opening: Skarn's pressure first, one paragraph the table can
      answer immediately, bank and pool explicit from the prepared Scene, event
      stops before a strap is cut or a blow lands. HP and later outcomes stay
      DM-side. No played records rewritten.
    - >-
      Previously On: past tense, Party as you, Transcript stopping point with
      Skarn still in Crissdalynn's face as the assigned Session 11 Transcript
      ends, quoted table speech word-for-word from that Transcript, Recap
      unchanged. No later CONSUME or invented inland rescue.
    - >-
      Terror-Bird First sight: concrete anatomy and visible signature tells
      from this run's Creature page identify its actual form before notice or
      attack. A figurative stand-in such as "the mossy shape" does not
      substitute for the Creature's form. No invented victim, mechanics stay
      DM-side, statblock otherwise unchanged.
    - >-
      Handout: the four order lines from this run's Two-Grave Orders, oldest
      first and verbatim, template-shaped, not claimed as already handed out.
      Hinewai, Death Bloom and officer stay outside the player document.
    - >-
      Every spoken block is clear on one hearing.
    - >-
      Spoken blocks are vivid: concrete sourced details already in motion,
      evidence instead of judgement words, so the table can picture the scene.
      Handout text stays the document's own voice and payload.
