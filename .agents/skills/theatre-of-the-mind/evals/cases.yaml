    visible signature tells. No victim and no attack outcome. (5) Create a
    Handout named Gold-Caste Order Chain under Session 12 from the current
    Handout template. The Handout text is Jean-Claude's written rendering of
    the four verbatim order lines in Two-Grave Orders, oldest first. Do not
    invent a signature, date, officer or hidden explanation. Link it to the
    prepared Orders in the Ash Scene. No art or Foundry work.
