- id: narration-slots
  source_pages:
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Prep.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Dawn Strike.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Smoking Skylight.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Terror-Birds.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Orders in the Ash.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Consume.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Previously On.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 11/Session 11 - Recap.md
    - The Shattered Sea/NPCs/Talon Skarn.md
    - The Shattered Sea/Creatures/Terror-Bird.md
  prompt: >-
    improve upon the session 12 narration blocks comprehensively, and the
    npc and creature ones the session uses
  checks:
    canon:
      The Shattered Sea/NPCs/Talon Skarn.md:
        - '\[!narration\] First look'
        - 'Set the toy on the stone\.'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Dawn Strike.md:
        - '\[!narration\] Opening'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Smoking Skylight.md:
        - '\[!narration\] Opening'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Terror-Birds.md:
        - '\[!narration\] Opening'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Orders in the Ash.md:
        - '\[!narration\] Opening'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Consume.md:
        - '\[!narration\] Opening'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - The Way Out.md:
        - '\[!narration\] Closing image'
      The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Previously On.md:
        - '\[!narration\]'
      The Shattered Sea/Creatures/Terror-Bird.md:
        - '\[!narration\] First sight'
  rubrics:
    - >-
      Session 12 Scene blocks are speakable after one hearing, grounded in
      this run's Locations and people, and stop before the Players would act.
      They keep PC choices and feelings with the Players and leave secrets
      and mechanics off the spoken text.
    - >-
      Previously On is past tense with the Party as you, and its last beat is
      the last one played in this run's Recap: Skarn's night attack on
      Crissdalynn, left unresolved with him still on her. Nothing after that
      beat is told, so the inland rescue, CONSUME and other Session 12
      outcomes stay out. The Recap is unchanged.
    - >-
      Skarn's First look uses this run's starting NPC cues, ends on his
      spoken line, and does not prescribe a PC action. Every other section,
      fact and callout title on the NPC page is kept.
    - >-
      Terror-Bird First sight lets the table picture the actual bird at rest
      before it notices anyone: a huge bird with at least one bird feature
      from this run's Creature page, such as the beak, talons or ground-shaking
      stride. Its mossy-stump disguise may frame the bird, and the bird itself
      is still shown. Mechanics stay DM-side.
- id: fatespinner-chat
  source_pages:
    - The Shattered Sea/Items/Fate Spinner.md
  prompt: >-
    Show me an improved version of the Fate Spinner narration block in the
    chat without editing the file itself.
  checks:
    canon:
      The Shattered Sea/Items/Fate Spinner.md:
        - 'A four-sided quartz top no bigger than a thumb stays cool in a warm hand'
  rubrics:
    - >-
      The reply offers an improved First look the DM can speak, using this
      run's starting Item facts: a thumb-sized quartz top, material and
      motion, and a visible sign of what it does. It does not prescribe a
      PC action or dump hidden history.
    - >-
      The Fate Spinner page itself is left unchanged. The improved block
      lives in the chat reply.

- id: gold-caste-handout
  source_pages:
    - The Shattered Sea/Lore/Two-Grave Orders.md
    - The Shattered Sea/Shattered Sea/Sessions/Session 12/Session 12 - Orders in the Ash.md
  prompt: >-
    I need a player handout of the gold caste orders for jean-claude on the
    burnt road. Just the four order lines oldest first, no extra explanation.
  rubrics:
    - >-
      The Handout text is the four order lines from this run's Two-Grave
      Orders, oldest first and verbatim, in the document's own voice.
      Hinewai, Death Bloom and officer commentary stay off the player document.
    - >-
      The reply names a new Session 12 Handout page with `type: Handout`,
      the order lines in its `[!narration] Handout text` callout, handed over
      in Orders in the Ash and not claimed as already handed out. No art or
      Foundry work is required.

