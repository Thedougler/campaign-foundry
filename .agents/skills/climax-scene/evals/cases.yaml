- id: climax-scene
  source_pages:
    - shattered-sea/Sessions/Session 12/session-12-prep.md
    - shattered-sea/Sessions/Session 12/session-12-consume.md
    - shattered-sea/Sessions/Session 12/session-12-dawn-strike.md
    - shattered-sea/Items/giants-guava.md
    - shattered-sea/Items/ghost-plum.md
    - shattered-sea/shattered-sea.md
  prompt: >-
    Redo Consume. Skarn is still loyal to Vantyrus and makes the later Spinner
    attempt after a fallen Ghost Plum. Auralis tells Perrin CONSUME beside
    living Giant's Guava; he can take the power and the island's wrath, or
    refuse. Don't bring Skarn back if he already got away with it, and don't
    force the fruit.
  checks:
    pages:
      - shattered-sea/Sessions/Session 12/session-12-consume.md
    sections:
      shattered-sea/Sessions/Session 12/session-12-consume.md:
        - '## At a glance'
        - '## Threads'
        - '## Play'
        - '### Situation'
        - '### Pressure'
        - '### Checks'
        - '## Outcomes'
        - '## Depth'
        - '### Hidden truths'
        - '### Spotlight'
    canon:
      shattered-sea/Sessions/Session 12/session-12-consume.md:
        - '^type:\s*Scene\s*$'
        - '^kind:\s*Climax\s*$'
        - '^> \[!narration\] Opening\s*$'
  rubrics:
    - >-
      The DM can run the Session's highest-stakes question from this page:
      earlier choices supply concrete leverage, the brink has starting
      positions and interruptible pressure, and opposition can be contested
      rather than succeeding by script. At least three distinct reachable
      endings, including costly success and refusal or withdrawal, state
      what changes for each converging Thread and hand that state to Resolution.
    - >-
      Eating living fruit, its useful benefit, the island's response,
      invisibility and its countermeasure match retrieved law and Item owners
      under 2024 5e. Every possible fight has fought Creature embeds and
      sourced XP arithmetic for the PCs able to act, with terrain, depletion
      and objective pressure explained rather than hidden in a difficulty label.
    - >-
      Skarn remains loyal to Vantyrus and seeks the Spinner; a later attempt
      uses the Ghost Plum only when prior play leaves that attempt possible.
      Escaped, captured or dead Skarn is not revived for another showdown.
      Previous possession, casualties, knowledge and spent resources persist,
      and proposed endings remain conditional rather than rewriting Canon.
    - >-
      Perrin's sourced bond with Auralis, the living Giant's Guava and the
      island's law make CONSUME a specific consequential choice. Accepting
      offers genuinely useful power at a real cost; refusal remains playable
      without compulsion. The other present PCs can affect what is saved or
      lost, and a compression option preserves the decisive choice if time runs short.
    - >-
      Every Opening and escalation callout meets theatre-of-the-mind
      standard: speakable after one hearing, grounded in the visible brink,
      with concrete form, scale against familiar things and usable spatial
      relationships. Each live event stops before Players would act; theft
      and Perrin's choice are not resolved in spoken text. Secrets, mechanics
      and PC actions, feelings or thoughts remain outside Narration.
