  rubrics:
    - >-
      Aruhe stays a Midchain Region without a settlement/state, with Western
      Landing as the sea approach and usable destination links. Routes differ
      in time, risk or cost. River direction, broad-crossing cost and the Long
      Meadow bypass remain options. Navigation rolls only for uncertainty, with
      Ability (Skill), DC and failure cost. Rest and supply name stops, costs
      and concurrent change. Fallen fruit is receiving; living growth invokes
      the law. Jean-Claude carried and Matteo refusing inland change travel.
      Powers have sourced next moves without inventing 1495 DR months. Rumours
      separate spoken claim from DM truth. Not a dungeon or Session itinerary.
    - >-
      Sparhold stays a timber fortress-market on the raiding-fleet trail.
      Arrival orients visitors. Recurring services have keepers, access terms
      and costs. Public violence still closes the berth; a reciprocal question
      remains a normal answer price. The information dispute has opposed wants,
      at least two approaches or a costly bypass, and a next consequence. A
      planted lead can be tested. Sparhold is a relay, not a claimed captive
      destination. New keepers or prices are design, not completed meetings.
    - >-
      La Vasca keeps canal arch, covered basin, cradle, tools and aft passage
      as a compact visit: spoken cues, current activity, usable objects.
      Low-tide and vouching constraints, tannery cover, ninety-foot limit and
      Nona's one-hour reporting remain. Repair, registry and route access have
      terms and opposed wants. No expedition clock or room-by-room dungeon.
      Uncertainty remains offshore near Aruhe; the prior refit is history.
    - >-
      Current templates, resolved links and honest provenance. Full scratch-root
      gate and one create log. hot, played Narration and Session records
      unchanged. Prepared rescue outcomes stay conditional.
