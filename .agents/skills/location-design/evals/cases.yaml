- id: deepen-aruhe
  source_pages:
    - The Shattered Sea/The Shattered Sea.md
    - The Shattered Sea/Campaigns/Shattered Sea/hot.md
    - The Shattered Sea/Locations/Aruhe.md
    - The Shattered Sea/Locations/The River.md
    - The Shattered Sea/Locations/Old Gardens.md
    - The Shattered Sea/Locations/Western Landing.md
    - The Shattered Sea/Locations/The Long Meadow.md
    - The Shattered Sea/Lore/Taking on Aruhe.md
    - The Shattered Sea/NPCs/Matteo Scola.md
    - The Shattered Sea/Campaigns/Shattered Sea/Quests/Take on Aruhe.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Perrin Black-Jaw.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Delmar Fisk.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Crissdalynn Khinriss.md
    - The Shattered Sea/Campaigns/Shattered Sea/PCs/Jean-Claude Tabarnack.md
  prompt: >-
    Deepen Aruhe as a Region so I can run choices between the current Slack
    Basin camp, inland survivors and the return to Uncertainty. Keep the
    established island scale, Western Landing approach, River direction and
    recorded route costs. Make travel alternatives, navigation, rest, supply,
    rumours and the powers' next moves usable without imposing a fixed Session
    itinerary. Jean-Claude is catatonic in Delmar's coat and Matteo wants ship
    passage, not an inland adventure. Respect the taking law and preserve
    played events and the prepared Session 12 outcome uncertainty. No art or
    Foundry connection is needed.
  checks:
    pages: [The Shattered Sea/Locations/Aruhe.md]
    canon:
      The Shattered Sea/Locations/Aruhe.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Region\s*$'
        - '^parent:\s*"\[\[Midchain\]\]"\s*$'
        - '\[\[Western Landing\]\]'
        - '\[\[Old Gardens\]\]'
        - '\[\[The River\]\]'
        - '\[\[Lava Tubes\]\]'
        - '/\b500\b/'
        - '/\b150\b/'
    sections:
      The Shattered Sea/Locations/Aruhe.md:
        - "## At a glance"
        - "## Play"
        - "### Travel"
        - "### Places worth reaching"
        - "### Encounters"
        - "### Rumors"
        - "## Depth"
        - "## Links"
  rubrics:
    - >-
      The Region retains its Midchain parent, approximately 500-by-150-mile
      scale, lack of a settlement/state and Western Landing sea approach.
      Routes have meaningful time/risk/cost differences and usable destination
      links. The River flows from Clear Lake toward Marshes, broad crossings
      still take many days or weeks, and the Long Meadow's hour-cost bypass
      remains an option. Added local timings are explicit new rulings, not
      falsely quoted source measurements.
    - >-
      Navigation rolls occur only for uncertainty and have Ability (Skill),
      DC and concrete failure consequences. Rest and supply specify reachable
      stops, costs, exposure and concurrent change. Fallen fruit remains
      receiving; living growth invokes the law. The real Party's mobility,
      Jean-Claude's carried state and Matteo's refusal to go inland affect
      travel rather than disappearing from the brief.
    - >-
      Active powers have sourced wants, observable next moves and relative
      times or triggers, without inventing 1495 DR months or weekdays. Rumours
      distinguish a spoken claim from the DM truth and give reachable ways to
      investigate. The Region is not converted into an obligatory dungeon or
      Scene sequence, and prepared rescue outcomes stay conditional.
    - >-
      The actual Region template, resolved owner links and honest provenance
      are used. The full scratch-root gate and one create log cover the operation;
      hot, played Narration and all Session records remain unchanged.

- id: deepen-sparhold
  source_pages:
    - The Shattered Sea/Campaigns/Shattered Sea/hot.md
    - The Shattered Sea/Locations/Sparhold.md
    - The Shattered Sea/Locations/Aruhe.md
    - The Shattered Sea/Factions/Passage.md
    - The Shattered Sea/Factions/Dravosi Crown.md
    - The Shattered Sea/Campaigns/Shattered Sea/Threads/Perrin and Nona.md
    - The Shattered Sea/Campaigns/Shattered Sea/Threads/Simone's Hunters.md
    - The Shattered Sea/Campaigns/Shattered Sea/Threads/The Crown Inspection.md
  prompt: >-
    Enrich the existing Settlement Sparhold for a possible later return after
    Aruhe. Keep its timber fortress-market, harbour compact, raiding-fleet
    information role and established local rules. Make arrival, resupply,
    pilots, departure records and witness interviews runnable, with named
    keepers and a choice-driven local information dispute. Reuse existing
    people and Factions when they fit; new keeper identities or prices are
    requested design, not previously met people or completed purchases.
    Do not move the Party from Aruhe or claim a return already occurred.
    This is Settlement worldbuilding, not Prep. No art or Foundry connection
    is needed.
  checks:
    pages: [The Shattered Sea/Locations/Sparhold.md]
    canon:
      The Shattered Sea/Locations/Sparhold.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Settlement\s*$'
        - '^parent:\s*"\[\[Midchain\]\]"\s*$'
        - '/timber/i'
        - '/reciprocal question/i'
    sections:
      The Shattered Sea/Locations/Sparhold.md:
        - "## At a glance"
        - "## Play"
        - "### Districts"
        - "### Services"
        - "### Factions here"
        - "### Local rules"
        - "## Depth"
        - "## Links"
  rubrics:
    - >-
      The Settlement remains a timber fortress-market on the raiding-fleet
      trail, not a new village replacing Canon. Outer berth, work yard,
      meeting place and rear landing orient arriving visitors. Recurring
      services have linked Site and keeper pages, concrete access terms and
      costs, and useful information is available through trust or payment.
    - >-
      Local Factions have actual linked NPC faces or explicitly authored new
      owners. Public violence still closes the berth and a reciprocal question
      remains a normal answer price. Enforcers, penalties and workarounds are
      usable without copying an unrelated Settlement's institutions.
    - >-
      The information dispute has opposed wants, observable signs, at least
      two materially different approaches or a costly bypass, and a next
      consequence at a relative time or trigger. A planted lead can be tested
      against the recorded ledger, wake, rope, tincture or false cargo evidence;
      Sparhold remains a relay, not an asserted final captive destination.
    - >-
      The current Settlement template and resolved owner pages are complete,
      new decisions are identified, and the full target-root gate and one
      create log cover all touched pages. The Party's post-Session 11 Aruhe
      state, hot and Session records remain unchanged.

