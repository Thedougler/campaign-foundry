  prompt: >-
    Three Location jobs in this World, one reply. The Party is still on Aruhe;
    none of this has already happened. (1) Deepen Aruhe as a Region so I can
    run choices between the Slack Basin camp, inland survivors and the return
    to Uncertainty. Keep island scale, Western Landing approach, River
    direction and recorded route costs. Make travel alternatives, navigation,
    rest, supply, rumours and the powers' next moves usable without a fixed
    Session itinerary. Jean-Claude is catatonic in Delmar's coat. Matteo wants
    ship passage, not an inland adventure. Respect the taking law. (2) Enrich
    Sparhold for a possible later return. Keep timber fortress-market, harbour
    compact, raiding-fleet information role and local rules. Make arrival,
    resupply, pilots, departure records and witness interviews runnable, with
    named keepers and a choice-driven local information dispute. Reuse existing
    people and Factions when they fit; new keepers or prices are requested
    design, not previously met people or completed purchases. (3) Deepen La
    Vasca for a possible later repair with Cobb, what a vouched vessel can use,
    and the low-tide route to Warren. Keep disguised tannery, ninety-foot
    cradle, garden password and one-hour reporting to Nona. Uncertainty is off
    Aruhe; its Calveno refit is history. Compact visit, not a dungeon. Do not
    rewrite played events, prepared Session 12 outcome uncertainty, hot, or
    Session records. No art or Foundry work.
