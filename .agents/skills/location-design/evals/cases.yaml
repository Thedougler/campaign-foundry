  rubrics:
    - >-
      The compact key preserves canal arch, covered basin, iron-and-timber
      cradle, tools/stock and aft passage, with spoken cues, current activity,
      usable objects and adjacent DM answers. Low-tide and vouching constraints
      on the Warren passage, defunct-tannery cover, three-generation operation,
      ninety-foot vessel limit and Nona's one-hour reporting remain true.
    - >-
      Repair, registry removal and route access have concrete terms, local
      opposed wants and a visible next change at a relative time or trigger.
      Any new operational hazard has sign, trigger, effect, counterplay, bypass
      and leverage, with sourced mechanics where needed. The brief does not
      impose enemies, expedition clocks or unnecessary room-by-room machinery.
    - >-
      Current notes keep Uncertainty offshore near Aruhe and treat its prior
      refit as history. Cobb's instructions, loyalty and Nona reporting remain
      coherent; new missing statistics stay with linked Creature owners.
      Template, provenance, full scratch-root gate and one create log are
      complete while hot, PC state and Session records remain unchanged.
