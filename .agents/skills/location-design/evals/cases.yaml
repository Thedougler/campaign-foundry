  prompt: >-
    Deepen La Vasca for a possible practical return visit: arranging a repair
    with Cobb, checking what a vouched vessel can use and asking about the
    low-tide route to Warren. Keep its disguised tannery, ninety-foot cradle,
    garden password and one-hour reporting to Nona. Uncertainty is currently
    off Aruhe; its Calveno refit is history, not a ship still waiting on the
    cradle. This is a compact visit and repair brief, not a dungeon expedition
    or a claim that the Party has already returned. No art or Foundry
    connection is needed.
