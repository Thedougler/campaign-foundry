# Aruhe adapts the production expansion ask in issue #34.
- id: three-kinds
  source_pages:
    - The Shattered Sea/Locations/Aruhe.md
    - The Shattered Sea/Lore/Taking on Aruhe.md
  prompt: >-
    Expand Aruhe into at least five distinct regions, including the centre.
    The beaches should be calmest, with increasingly vicious fauna and
    carnivorous flora inland, ramping up to the Blight and Death Bloom.
    The two innermost regions should be too dangerous for a party of five
    below level 10. Use standard Locations and Regions, not a dungeon.
  checks:
    pages:
      - The Shattered Sea/Locations/Aruhe.md
    canon:
      The Shattered Sea/Locations/Aruhe.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Region\s*$'
  rubrics:
    - >-
      Aruhe has at least five distinct child Regions with saved, linked
      Location pages, including a central Region. Existing Regions are
      reused or deepened where they fit, and established Sites retain their
      identities within a coherent hierarchy. The island remains a wilderness
      at its sourced scale rather than becoming a room-key dungeon.
    - >-
      Beaches, intermediate Regions and the two innermost Regions form a
      legible escalation in carnivorous flora and violent fauna. Concrete
      hazards, inhabitants and terrain explain why a party of five below
      level 10 should avoid the innermost threats. Warning signs, route
      trade-offs and retreat preserve agency; danger is not an arbitrary
      level lock, compulsory fight or guaranteed death.
    - >-
      Travel between Regions is usable from their pages, with consistent
      connections, meaningful costs and alternative routes. The starting
      island geography, taking law and relationship between Hinewai, the
      Blight and Death Bloom survive. New geography and threats are design,
      not retroactive discoveries or resolved Session events.

- id: calveno-harbour
  source_pages:
    - The Shattered Sea/Locations/Calven and Calveno.md
    - The Shattered Sea/Locations/Le Paludi.md
  prompt: >-
    Deepen Calveno's harbour so I can run arrival, inspection and berth
    from the page. Keep the canal city, Crown flag and debt politics. Give
    me what a cutter sees coming in, who actually controls the docks, and
    where the Party would go next without inventing a new city.
  checks:
    pages:
      - The Shattered Sea/Locations/Calven and Calveno.md
    canon:
      The Shattered Sea/Locations/Calven and Calveno.md:
        - '^type:\s*Location\s*$'
        - '^kind:\s*Settlement\s*$'
  rubrics:
    - >-
      Arrival, harbour control and next destinations are usable from the
      existing Settlement. Crown flag, Tessarine credit, canals and Passage
      routes below survive. New dock detail is design on this city, not a
      second Calveno or a rewritten Session history.
    - >-
      Inspection, berth and conflicting papers produce concrete choices.
      Named places already in the starting Wiki are reused. Hidden truths
      stay DM-facing; public harbour knowledge stays Player-safe.
