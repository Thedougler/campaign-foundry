# Grounded adaptation; no original Item-creation ask was recovered. Fate Spinner chat-only lives on theatre-of-the-mind.
- id: charm-and-letters
  source_pages:
    - The Shattered Sea/Locations/Lava Tubes.md
    - The Shattered Sea/Shattered Sea/PCs/Perrin Black-Jaw.md
  prompt: >-
    Design an uncommon Rescue Line Charm for Perrin to help keep people
    alive during rope rescues on wet ledges. I want something useful
    alongside the crew's flight, not another way to fly or swim.
  checks:
    pages:
      - The Shattered Sea/Items/Rescue Line Charm.md
    canon:
      The Shattered Sea/Items/Rescue Line Charm.md:
        - '^type:\s*Item\s*$'
  rubrics:
    - >-
      The design uses the starting bearer and Party capabilities and
      equipment, with retrieved Item candidates informing reuse, reskin or
      adaptation. Its rope-rescue niche adds a meaningful choice rather than
      duplicating existing flight, swimming or defensive equipment.
      Uncommon power is justified against suitable retrieved peers.
    - >-
      Mechanics give the table usable action costs, targets, reach,
      anchoring, load, duration, uses, recovery and failure consequences as
      relevant to the chosen effect. It helps a rescue without guaranteeing
      extraction or waiving Aruhe's established taking law.
    - >-
      A Player-safe introduction and discoverable properties support use.
      The charm is a requested design, not an already found or purchased
      Item: PC Inventories, played rescues and Session outcomes stay unchanged.
