  prompt: >-
    Two Item jobs, one reply. (1) Design an uncommon Item called Rescue Line
    Charm for Perrin's work keeping the crew and rescued people alive. Help
    with rope rescues on wet ledges like the Lava Tubes, not flight or a Swim
    Speed he already has. Source existing Items before deciding whether to
    reskin or adapt one. Keep it useful beside Delmar's Flying Boots,
    Crissdalynn's flight and Perrin's current equipment. Do not claim it was
    found, purchased or already carried, and do not add it to a PC Inventory
    or a prepared Session as an acquired reward. Aruhe's taking law still
    applies. (2) The Party holds Barnaby Rook's Letters of Marque. Deepen that
    existing plot Item so I can run their use as evidence, a bluff, a bargaining
    chip or forgery stock during continuing Crown pursuit. Preserve the
    licence, 30,000 gp bond, nonmagical nature, custody and recorded seal and
    bluff consequences. Make actual people react according to what they know
    now; do not invent a sale or legal acquittal that has already happened.
    No art or Foundry work. Do not edit hot or Session records.
