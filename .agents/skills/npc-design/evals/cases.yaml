- id: harbour-clerk
  prompt: The Party is going to the Saltwick harbour office to ask about old boat records. Give me the clerk who works there.
  rubrics:
    - A new NPC page exists in Lowtide/NPCs/ with its `creature` property linking an existing Creature (reused, not a new stat block), and the gate passes.
    - The clerk has a present-tense want, a secret with ways to learn it, and a limit, each concrete enough to change a Scene.
    - The First look gives one distinctive feature and one thing they are doing, then one spoken line; the voice comes from what they care about, not an accent.
    - The clerk passes the swap test against Hobb Tarrow and the other Saltwick NPCs (a distinct twist tied to Lowtide Canon).
    - The Play section lets the DM run the Party's likely asks about boat records, with an Influence check where the outcome is uncertain.
- id: deepen-hobb
  prompt: Hobb Tarrow is going to be a big part of the next arc. Deepen him.
  checks:
    canon:
      Lowtide/NPCs/Hobb Tarrow.md: [Corvin Tarrow]
  rubrics:
    - Every fact already on Hobb's page survives, including his ancestor Corvin Tarrow and the burned letter.
    - Hobb gains a thread to each PC he can touch, a next move if ignored, and tells for each hidden truth, all grounded in pages that exist.
    - His secret has about three ways for the Party to learn it, placed in different spots.
- id: ilse-villain
  prompt: Make Ilse Corran a proper villain for the next arc.
  checks:
    canon:
      Lowtide/NPCs/Ilse Corran.md: ['creature: "\[\[Bandit Captain\]\]"']
  rubrics:
    - Ilse's plan is filed as a Thread page in the Campaign's Threads/ with steps the Party can see and interrupt, each with a sign and a fallback, and her NPC page links it.
    - The plan has at least three live endings reachable through play, not one required check.
    - Established facts about Ilse survive (Ilse Marrow, the Bandit Captain statistics, the ledger she wants).
