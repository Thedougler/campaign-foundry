- id: harbour-clerk
  prompt: The Party is going to the Saltwick harbour office to ask about old boat records. Give me the clerk who works there, named Mara Kett.
  checks:
    pages: [Lowtide/NPCs/Mara Kett.md]
    sections:
      Lowtide/NPCs/Mara Kett.md: ["## At a glance", "## Play", "## Depth", "## Links"]
    absent:
      Lowtide/NPCs/Mara Kett.md: ['```statblock', '!\[\[[^]]+#Statblock\]\]']
  rubrics:
    - Mara Kett is a named NPC whose creature property resolves to a complete Creature; a fitting Wiki Creature is reused without making statistics unique merely because the person has a name.
    - The Agent records why existing Wiki people do not fill the requested Saltwick role, then sources applicable 2024 rules or archetypes before web co-option or novel identity; provenance is honest and sources holds only archived Raw.
    - The clerk has a concrete present-tense want, leverage with a cost, a limit and an explicit secret with discoverable evidence, without contradicting the Vessen ledger's established truth.
    - First look gives a distinctive visible detail, an activity and a spoken line; the voice grows from the clerk's concerns rather than an accent.
    - Play answers the Party's likely boat-record requests, distinguishes automatic willingness from uncertainty, and uses sourced 2024 Influence with attitude, DC and meaningful success or failure consequences.
- id: deepen-hobb
  prompt: Hobb Tarrow is going to be a big part of the next arc. Deepen him.
  checks:
    canon:
      Lowtide/NPCs/Hobb Tarrow.md: [Corvin Tarrow, 'burned it', 'nine generations', 'does not know why', 'loaned the Party', 'creature: "\[\[Bandit Captain\]\]"']
    absent:
      Lowtide/NPCs/Hobb Tarrow.md: ['```statblock', '!\[\[[^]]+#Statblock\]\]']
  rubrics:
    - Every established fact survives, including the burned letter, his ignorance of the motive, his family history and the heard First look; played Session pages and hot.md are unchanged.
    - Hobb gains actionable invitations tied to each relevant PC's existing Goals and bonds or Plans, a next move if ignored and a testable tell for each hidden truth, without inventing prior PC relationships.
    - His secret has three distinct discovery routes with concrete evidence; the original ash and post-ledger questioning routes remain usable.
- id: ilse-villain
  prompt: Make Ilse Corran a proper villain for the next arc.
  checks:
    canon:
      Lowtide/NPCs/Ilse Corran.md: [Ilse Marrow, 'twenty years', 'never used the pistol', 'does not know', 'creature: "\[\[Bandit Captain\]\]"']
      Lowtide/Campaigns/Salt and Lantern/Threads/Reedrunner Tithe.md: [Tamsin]
    absent:
      Lowtide/NPCs/Ilse Corran.md: ['```statblock', '!\[\[[^]]+#Statblock\]\]']
  rubrics:
    - Ilse's plan lives on an appropriate active-Campaign Thread page, reusing Reedrunner Tithe when it fits, with visible interruptible steps, costs and fallbacks, and the NPC links it.
    - At least three distinct endings are reachable through Party choices rather than a required single roll or scripted villain success.
    - Established facts survive, including Ilse Marrow, the ledger she wants, her unused pistol, twenty years of back-channel taxes and lack of knowledge that Sable guards the ledger; statistics stay linked to the shared Bandit Captain.
    - The plan respects current hot.md state and all three PCs' recorded concerns, without rewriting hot.md, played Scenes or Recaps.
