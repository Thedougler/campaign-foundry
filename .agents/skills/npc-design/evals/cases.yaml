# Malone is the recovered scale-up ask. Quackers fills the missing flavour-NPC request.
- id: malone-scale
  source_pages:
    - The Shattered Sea/NPCs/Aleksander Malone.md
    - The Shattered Sea/Shattered Sea/Quests/The Hound of God.md
  prompt: >-
    Scale up the Aleksander Malone statblock. He should be roughly equivalent
    in power to a level 12 player character, an optimized cleric, fighter,
    rogue multiclass built for exorcising fiends and killing heretics. Keep
    it an easy to run monster statblock for the DM.
  checks:
    pages:
      - The Shattered Sea/Creatures/Aleksander Malone (Creature).md
      - The Shattered Sea/NPCs/Aleksander Malone.md
    canon:
      The Shattered Sea/Creatures/Aleksander Malone (Creature).md:
        - '^type:\s*Creature\s*$'
        - 'layout: Basic 5e Layout'
      The Shattered Sea/NPCs/Aleksander Malone.md:
        - 'creature: "\[\[Aleksander Malone \(Creature\)\]\]"'
    absent:
      The Shattered Sea/NPCs/Aleksander Malone.md:
        - '^```statblock\b'
        - '!\[\[[^\]]+#Statblock\]\]'
  rubrics:
    - >-
      The Creature is a runnable unique antagonist around an optimized
      level-12 cleric/fighter/rogue exorcist, with clear timing, targets,
      limits and condition endings. The table can run him from the statblock
      without reconstructing a Player character sheet.
    - >-
      Identity, Crown confirmation leash, hunt for Grigori and heretic-judgement
      role survive. Shared rules live on the Creature page; the NPC keeps
      person, voice and wants.
    - >-
      The scale-up is design, not a completed judgement or played encounter.
      Existing Session records stay intact.

- id: quackers-flavour
  source_pages:
    - The Shattered Sea/The Shattered Sea.md
    - The Shattered Sea/Shattered Sea/Shattered Sea.md
  prompt: >-
    Add Quackers as an npc. If asked he will happily talk at length about his
    former master the great Wizard RTLB, master of duomancy (magic which
    allows two to act as one), master of transfiguration and conjuration,
    rescuer of the dragon clans, tamer of faeries, his original creator, and
    the greatest wizard quackers has known of, none he has met since have
    surpassed the might of the two gnomes in a trenchcoat known as RTLB
  checks:
    pages:
      - The Shattered Sea/NPCs/Quackers.md
    canon:
      The Shattered Sea/NPCs/Quackers.md:
        - '^type:\s*NPC\s*$'
        - RTLB
        - duomancy
    absent:
      The Shattered Sea/NPCs/Quackers.md:
        - '^```statblock\b'
  rubrics:
    - >-
      Quackers is a playable NPC who, if asked, talks at length about RTLB
      using the supplied titles, duomancy as two acting as one, and the two
      gnomes in a trenchcoat. That talk is flavour he offers, not a dumped
      secret or a required scene.
    - >-
      Identity, voice and wants fit a familiar or companion rather than a
      combat antagonist. Statistics, if any, stay on a linked Creature.
      RTLB is not filed as an already-met World power beyond what Quackers
      claims.
    - >-
      New details are design. Played records stay intact, and a resolving
      incoming link makes the NPC reachable.
