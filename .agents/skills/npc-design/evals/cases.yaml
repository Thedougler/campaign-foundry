  prompt: >-
    Three NPC jobs in this World, one reply. The Party is still on Aruhe; none
    of this has happened yet. (1) Give Oleandro Fuschi, already recorded at
    The Ponte Bassa, an NPC page for a possible later meeting about Calveno
    hull movements. Keep twenty years of unwritten vessel memory, fish broth,
    direct answers and increasingly false manifests. Make conversations,
    limits, leverage and uncertain requests table-ready. Reuse fitting shared
    Creature statistics; his name does not make him a unique fighter. (2)
    Deepen Nona Black-Jaw as a recurring NPC for the crew's rescue obligation
    after Aruhe. Keep her history, kitchen voice, Passage limits,
    missing-persons desk, two dispatched ships, protection of Felix and
    unresolved Vestra knowledge. Ground invitations in the actual PCs' Goals
    and bonds or Plans, give a next move if ignored, and distinct discovery
    for hidden truths. Keep Perrin's sending stone and the existing Perrin and
    Nona Thread; invent no past ties to the other PCs and do not assume a
    completed return. (3) Make Simone Tabarnack a runnable villain for the
    pursuit after Aruhe. Deepen her existing person and put her interruptible
    future plan on Simone's Hunters, not a parallel Thread. Keep purple-caste
    identity, incomplete Gold rite, dead maintainer Ozzeth, Crown toxin
    bargain, restraint with soldiers and the goal to capture Jean-Claude. He
    is catatonic in Delmar's coat; the captive trail points toward Karath.
    Multiple endings, no omniscience, no scripted win. Do not retune linked
    statistics. No art or Foundry work. Do not rewrite hot or Session records.
