  rubrics:
    - >-
      Oleandro is the Site's keeper, not an invented clerk. Actual NPC
      candidates are searched; Commoner is considered before any new Creature.
      Nona's established facts survive: forty years feeding the Warren, the
      Mercatura desk, more than 314 missing fighting-age men, two Passage
      ships, Felix under a one-month protection, private Calveno Candle
      history, incomplete Vestra knowledge, existing First look and Commoner
      link. Simone's history survives: she reported Jean-Claude and Pell,
      refuses to waste soldiers, independently found the rite, remains
      incompletely transformed after Ozzeth's death, supplied Crown toxin;
      capture-not-kill is distinguished from hunters killing Grung leavers.
      Provenance separates Site/Wiki facts from new identity; sources hold
      only archived Raw. Statistics stay on linked Commoner pages unless
      separately requested.
    - >-
      Oleandro has a present want, costly leverage, limit and explicit secret
      with discoverable evidence, without changing the twenty-year memory or
      false-manifest problem. Nona: every relevant PC gets a distinct
      invitation or explicit none from real Goals, bonds or Plans; catatonic
      Jean-Claude is not freely conversing; invitations have choice and cost;
      the ignored next move reuses the existing Thread. Simone's plan lives on
      Simone's Hunters with a resolving NPC link; every step has
      trigger/time, sign, resource or cost, ignored consequence, Party
      interruption, fallback and her reaction; it does not assert scouts
      already found the current camp or grant unearned knowledge.
    - >-
      Oleandro's likely ship-record, manifest-comparison and payment requests
      are runnable. Attitude is separate from willingness; automatic answers
      follow goals; Hesitant requests use retrieved 2024 Influence, its DC,
      attitude modifiers and meaningful success/miss. Essential information
      has three independent paths. Each of Nona's hidden truths has a testable
      tell and three distinct discovery routes; what she knows, hides and can
      grant stays separate from DM truth; no second sending stone. Simone has
      at least three endings reachable by Party choice, not a required roll,
      guaranteed capture or cutscene, respecting present capability and
      Jean-Claude's inability to scout or negotiate now.
    - >-
      Oleandro follows the current NPC template, links a complete Creature,
      and gains a non-index incoming link from The Ponte Bassa. Nona's new
      depth is identified as design, filed through actual owner templates,
      Player-safe without replacing already-heard First look. Simone does not
      silently gain unique combat rules. All three pages and the Thread have
      resolving dependencies, honest provenance, full scratch-root gate and
      one operation log covering touched owners. Hot, already-heard Narration
      and Session records remain unchanged; meetings and plans stay future.
