# Real-source consistency checks, not newly reported table failures.
- id: named-claim
  source_pages:
    - shattered-sea/Lore/auralis.md
    - shattered-sea/shattered-sea.md
  prompt: Has Auralis already said CONSUME to Perrin? Audit that claim.
  checks:
    canon:
      shattered-sea/Lore/auralis.md: [CONSUME, Grow, Not yet, Giant, Stonepear]
      shattered-sea/log.md: ['/\] audit \|/']
  rubrics:
    - The audit stays on the named temporal question. Against this run's Campaign state and Session records, CONSUME and the fruit instruction remain a prepared possibility rather than a message already heard.
    - Both the full-truth paragraph and chronology on Auralis are checked, together with other present assertions of that same claim. One corrected sentence with another past-event assertion left behind fails.
    - Grow and Not yet remain recorded past speech. Auralis's origin, limits, unwitting pact, motives and ignorance of Aruhe's law keep their meanings; the future plan is not deleted.
    - The Campaign state and prepared Scene provide the temporal evidence. Played records, the Scene's planned content and unrelated claims stay byte-for-byte unchanged.
    - Each actual fix has its own audit log entry identifying the change and deciding evidence; the report claims only findings supported by this run's sources and changes.
    - The short report names the temporal scope and asks no questions.
- id: after-ingest
  source_pages:
    - shattered-sea/log.md
    - shattered-sea/shattered-sea.md
  prompt: Audit the 30 September First Ingest session deltas and their neighbours.
  rubrics:
    - The scope starts with the eight bullets under the First Ingest session-deltas entry, then linked neighbours, rather than treating every First Ingest entry or the whole Wiki as the request.
    - The audit checks actual present-state consistency against played Recaps, preserving this run's last played Session and date uncertainty.
    - Session 12 rescue, departure and later-level rewards remain planned outcomes. They do not overwrite this run's PC Sheets or assert that the rescue has happened.
    - The actual hot claim that Skarn broke off is compared with the Recap's unresolved attack. The audit preserves hot as tool-owned and preserves the played Recap, reporting the discrepancy for its owner rather than treating hot as a later played event.
    - Auralis's already-heard CONSUME claim is corrected to the prepared Session 12 plan on mutable Lore, without deleting the plan or changing the earlier Grow and Not yet history.
    - Findings come from this run's present pages and evidence. The historical First Ingest audit entry is not presented as a fresh finding or new DM feedback.
    - Each actual finding is settled by Canon precedence, with independent facts and overtaken history preserved and one log entry per fix. Pages without a decided finding and played records remain unchanged.
    - The short report names the Ingest slice and reports actual fixes or a current result, without asking the DM to settle the audit.
