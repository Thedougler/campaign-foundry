- id: hook-scene
  source_pages:
    - shattered-sea/Sessions/Session 12/session-12-prep.md
    - shattered-sea/Sessions/Session 12/session-12-dawn-strike.md
    - shattered-sea/Sessions/Session 11/session-11-recap.md
    - shattered-sea/shattered-sea.md
  prompt: >-
    Redo Dawn Strike for session 12, we're redoing it from the top since the
    skills have had significant upgrades. Jean-Claude will be awake at the
    start of the session, he was only catatonic because the player was absent.
    Skarn wants it for Vantyrus. Long term Vantyrus knows Skarn will attempt to
    kill him, as of right now Skarn is loyal. His goal is always the Spinner
    rather than winning a prolonged fight.
  checks:
    pages:
      - shattered-sea/Sessions/Session 12/session-12-dawn-strike.md
    sections:
      shattered-sea/Sessions/Session 12/session-12-dawn-strike.md:
        - '## At a glance'
        - '## Play'
        - '### Situation'
        - '### Handles'
        - '### Checks'
        - '## Outcomes'
        - '## Depth'
        - '### Hidden truths'
        - '### Threads'
        - '### Spotlight'
    canon:
      shattered-sea/Sessions/Session 12/session-12-dawn-strike.md:
        - '^type:\s*Scene\s*$'
        - '^kind:\s*Hook\s*$'
        - '^> \[!narration\] Opening\s*$'
        - '^### Checks\n(?:(?!#{2,3} ).*\n)*?.*==[^=\n]+=='
  rubrics:
    - >-
      The DM can run the Hook from this page and its resolving owner embeds:
      one immediate pressure, an obvious first move and at least three
      materially different responses with usable costs, opposition responses
      and a commitment that ends the Scene. Hesitation and refusal also have
      concrete consequences and a coherent handoff rather than a forced win.
    - >-
      Uncertain theft, capture, attacks and escape use complete, source-correct
      2024 rulings rather than automatic results. Possible fights have owner
      Creature embeds and sourced XP arithmetic for the PCs actually able to
      act; terrain, surprise and objective pressure are accounted for honestly,
      including any force that exceeds the Party's budget.
    - >-
      The resumed attack preserves the last played positions, unresolved
      contest and spent resources. Jean-Claude acts under the DM's awake
      override without a fabricated cure or rewritten play. Skarn remains
      loyal to Vantyrus and seeks the Spinner, not a predetermined kill;
      theft, capture and escape stay conditional and carry their actual
      possession and custody states forward.
    - >-
      The camp, usable space and Skarn's behaviour make this a specific,
      memorable opening rather than a generic ambush. Each participating PC
      has a grounded opportunity to answer the pressure, and keeping or
      losing the Spinner plants a question the later Session can pay off.
    - >-
      Every Opening variant meets theatre-of-the-mind standard: speakable
      after one hearing, with a concrete disturbance in the Party's sight,
      clear placement, physical form and scale the table can use, measured or against familiar things, and
      sourced sensory detail. It stops before a live theft, blow or escape
      resolves, keeps secrets and mechanics in DM notes, and assigns no PC
      action, feeling or thought.
    - >-
      Each uncertain check carries a Cue per result, and no failure Cue is a
      blank.
