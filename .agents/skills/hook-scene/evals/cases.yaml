      remain contests whose results carry into the next Scene.
    - >-
      Jean-Claude can act under the DM's explicit awake override without a
      fabricated cure or rewritten prior play. Spoken Narration is grounded in
      this run's camp and people, stops before the theft or a blow lands, and
      leaves PC choices to the Players.
