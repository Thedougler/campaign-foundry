  prompt: >-
    Three Creature jobs in this World, one reply. (1) Design Terrace Stalker
    for a possible later Old Gardens hunter that uses irrigation ditches and
    collapsed steps; Hard if the Party confronts it; requested new design, not
    an animal already encountered. Source fitting Creatures before deciding how
    much invention is needed. (2) Retune Talon Skarn's Creature for an
    interruptible theft of Crissdalynn's Fate Spinner, not overwhelming damage.
    Prospective design, not a report that Session 11 was too easy or too hard.
    Keep the one spent Legendary Resistance, identity, ignorance and withdrawal
    condition. Audit every linked NPC and unplayed consumer; change only an
    unplayed consumer that needs a consequential adjustment. (3) For an ordinary
    Dravosi Crown boarding guard in a spear-and-shield inspection line, reuse
    what fits; do not retune Corbin Knighton or mint a duplicate page for a
    rank-and-file name. Use the current Party, including Jean-Claude catatonic
    and carried by Delmar. Preserve flight, escape, rescue and Aruhe's taking
    law. Do not insert these into Session 12 or rewrite played records, hot, or
    heard Narration. No art or Foundry work.
  checks:
    pages:
      - The Shattered Sea/Creatures/Terrace Stalker.md
      - The Shattered Sea/Creatures/Talon Skarn (Creature).md
      - The Shattered Sea/Creatures/Dravosi Enforcer.md
    sections:
