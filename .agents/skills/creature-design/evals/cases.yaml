      The Shattered Sea/NPCs/Talon Skarn.md: ['^```statblock\b', '!\[\[[^\]]+#Statblock\]\]']
  rubrics:
    - >-
      Source records distinguish Wiki, 2024 SRD and web candidates from new
      output. Terrace Stalker names reuse, reskin, variant or new-design and
      why earlier candidates fail the ditch-and-terrace hunter role. Skarn
      changes serve the theft objective, justified against all four real PC
      Sheets, current participation, equipment, control, mobility and rescue,
      and are distinguished from Session 11 evidence with no invented table
      feedback, damage totals or rounds. The boarding-guard job finds and
      reuses Dravosi Enforcer's 2024 SRD Guard baseline without silently
      raising published numbers or minting a custom/duplicate Creature. Failed
      retrieval is not proof a candidate is absent. sources frontmatter holds
      only archived Raw paths.
    - >-
      The dossier reads all four level-5 Sheets and applicable House Rules,
      separates membership from combat participation, and accounts for
      Jean-Claude's catatonia and Delmar carrying him. Terrace Stalker is one
      opponent on ditches and steps; Hard maps to the 2024 High XP budget.
      Skarn is one thief with distance, cover, carried Jean-Claude, resources,
      budget and a retrieved peer. Both models show legal three-round actions,
      attack/save chances, burst versus sustained output, survival and
      time-to-drop estimates. No unsupported 2024 CR formula or fictional turn
      record. Crissdalynn's Stunning Strike, flight and Party counterplay stay
      consequential. Guard reuse does not fabricate a retune or create log.
    - >-
      Terrace Stalker's niche is distinguishable from the Spiguar's tall-grass
      ambush. Each new signature has an ecological sign, visible tell, two
      mechanically different answers and a payoff. Skarn remains a peregrine
      apprentice who targets gear, wants the Spinner for Vantyrus, does not
      know its purpose and withdraws below half health; one spent Legendary
      Resistance is current, not refilled. Appearance, history and heard
      Narration survive. Flight, allied rescue, retreat and Aruhe's taking law
      remain usable; new statistics do not erase recorded PC strengths. The
      shared Skarn Creature is changed once, never copied onto an NPC. Corbin's
      identity and shared Enforcer statistics are preserved.
    - >-
      Terrace Stalker uses the current Creature template, one complete Basic 5e
      Layout block in 2024 wording, explicit timing/targets/condition endings,
      Player-safe First sight and a real incoming link. The reply enumerates
      Skarn's NPC and every unplayed consumer from actual backlinks, with each
      consequential adjustment or reason for none. Played Session pages, hot
      and prepared Session 12 stay byte-unchanged. Full scratch-root gate runs;
      standalone work logs once after success; new Canon is identified. Where
      hot implies a Skarn breakoff, the Recap's unresolved endpoint is kept.
