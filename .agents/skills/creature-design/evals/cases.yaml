      against the Party and compares an appropriate retrieved peer.
      Design estimates are distinguished from observed Session events;
      no invented damage totals, rounds or table feedback justify the retune.
    - >-
      Identity, knowledge, withdrawal behaviour and spent resources agree
      with the starting sources except for the DM's explicit changes.
      Present loyalty is compatible with the future Rule of Two rivalry.
      The Session 11 Recap's unresolved attack is not rewritten as a played
      breakoff or a completed theft. Shared rules stay on one Creature page;
      linked NPCs and unplayed consumers remain consistent with the retune.
