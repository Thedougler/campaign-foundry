# Default case (statblock split 2026-10-12): a filed Campaign Creature deepened as a being. Its statblock stays as published, since the ask names no retune, and the page migrates its retired At a glance, Play and Depth layout to the template's sections (docs/wiki-layout.md **Retired shapes**). Statistics belong to statblock-design, whose cases cover a retune.
- id: creature
  source_pages:
    - shattered-sea/Creatures/terror-bird.md
    - shattered-sea/Sessions/Session 12/session-12-the-smoking-skylight.md
    - shattered-sea/Sessions/Session 12/session-12-terror-birds.md
  prompt: >-
    The Terror-Bird page needs work before the Party heads back to Aruhe.
    I want to know how they actually live there, what the Party can find
    before one finds them, and how they could drive one off or slip past it
    without a fight. Leave its numbers alone.
  checks:
    pages:
      - shattered-sea/Creatures/terror-bird.md
    sections:
      shattered-sea/Creatures/terror-bird.md:
        - "## Statblock"
        - "## Tactics"
        - "## Outside a fight"
        - "## Ecology"
        - "## Hidden truths"
    canon:
      shattered-sea/Creatures/terror-bird.md:
        - '^type:\s*Creature\s*$'
        - '^```statblock\b'
        - '^hp: 200\s*$'
        - '\[!narration\] First sight'
    absent:
      shattered-sea/Creatures/terror-bird.md:
        - '^## (At a glance|Play|Depth)\s*$'
  rubrics:
    - >-
      The Terror-Birds read as this Aruhe predator and no other: where they
      range on the lava-tube ground, what they eat, and a trace the Party can
      find before contact for each signature, such as the straight beaten
      line and the thrum of the stride.
    - >-
      The page gives the Party real ways to avoid a fight: what drives one
      off or turns it aside (the ground it refuses, the gag), and how it
      answers hiding or retreat, each consistent with its statblock entries.
    - >-
      Every fact from the old At a glance, Play and Depth sections survives
      in the section whose guidance asks for it, the statblock's numbers are
      unchanged, and played records and heard Narration stay as they were.

# creature split 2026-10-11: generic reusable monster, statblock only, no World. Files a World-free page at the vault root's Creatures/ from wiki/templates/creature.md, keeping only its frontmatter and Statblock and leaving out the Campaign-bound `revealed` (docs/wiki-layout.md **World-free pages**, ADR 0039, ADR 0040, ADR 0044). creature-design routes the statistics to statblock-design. `## Links` is optional, so the absent check tolerates it. No source_pages by design (evals/README.md § Grounding); Design verdict pending its first baseline run. Derived-number arithmetic is the Checks' `statblock` gate layer, not a rubric.
- id: generic-monster
  prompt: >-
    I want a monster for my own collection that isn't tied to any campaign
    or world, so I can drop it into any game. Call it a Mire Lurker: a swamp
    ambusher around CR 3 that bites, grabs someone and drags them under the
    water. 2024 rules, and keep it easy to run.
  checks:
    pages:
      - Creatures/mire-lurker.md
    sections:
      Creatures/mire-lurker.md:
        - "## Statblock"
    canon:
      Creatures/mire-lurker.md:
        - '^type:\s*Creature\s*$'
        - '^cr: [0-9.]+\s*$'
        - '^```statblock\b'
        - '^layout: Basic 5e Layout\s*$'
        - '(Melee|Ranged) Attack Roll:'
    absent:
      Creatures/mire-lurker.md:
        - '^##+ (?!(Statblock|Links)\s*$)'
        - '^kind:'
        - '^revealed:'
        - '#\s*Campaign-bound'
        - '\[!narration\]'
        - 'Weapon Attack:'
  rubrics:
    - >-
      The statblock is correct, complete and easy to run at the table under
      the 2024 rules at about CR 3: every entry gives its timing, targets,
      reach or range and results. The grab names its escape, and the drag
      under has a limit and at least two answers its own text gives.
    - >-
      The monster drops into any campaign: a plain kind name with no proper
      noun, place, faction, deity or World fact, and no lore, tactics or
      Narration beside the block. Every feature beyond its core attacks and
      signature fits any setting and earns its place; nothing is padding.
