    - >-
      The retune makes theft a contest the Party can interrupt, with visible
      tells, different tactical answers and meaningful consequences for
      positioning, control, flight and allied rescue. Skarn can threaten the
      Spinner without requiring its loss or winning by overwhelming damage.
      Timing, targets, limits and condition endings are clear enough to run
      from the Creature page without reconstructing a PC build.
