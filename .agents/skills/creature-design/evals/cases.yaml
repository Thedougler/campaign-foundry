- id: new-hunter
  prompt: During the Long Ebb the Party will cross the exposed flats of the Brack. I need a new Creature called Silt Skimmer that hunts the bared mud at low water, a Hard fight for this Party.
  checks:
    pages: [Lowtide/Creatures/Silt Skimmer.md]
    sections:
      Lowtide/Creatures/Silt Skimmer.md: ["## At a glance", "## Statblock", "## Play", "## Depth", "## Links"]
    canon:
      Lowtide/Creatures/Silt Skimmer.md: ['layout: Basic 5e Layout']
  rubrics:
    - The full Creature block is written in 2024 rules phrasing with explicit action timing, targets and condition endings, and all check layers pass.
    - The Agent reads all three level-3 PC Sheets and applicable House Rules, states encounter count and terrain, and maps the requested Hard fight to the 2024 High XP budget without claiming 2014 CR calculation is a 2024 rule.
    - The reply gives estimated survival and time to drop the most exposed PC from a three-round model, with attack or save chances, resource assumptions and a sourced CR peer; defence and offence estimates are labelled as estimates.
    - The signature has a visible tell before its threat, at least two mechanically usable answers and a payoff on the page.
    - Its hunting niche differs from the Mire Drowner and grows from Lowtide Canon; each signature ability has an ecological sign and a visible tell in First sight.
    - Recorded sourcing goes Wiki, 2024 SRD, then web before novel design, and the page names its retrieved inspiration and changes without putting URLs in sources.
- id: retune-drowner
  prompt: The Mire Drowner felt too soft last Session; the Party took two of them apart. Retune it for this Party.
  checks:
    pages: [Lowtide/Creatures/Mire Drowner.md]
    canon:
      Lowtide/Creatures/Mire Drowner.md: [Sable, 'citizens who could not get out', 'remember the gate opening', 'do not speak', 'do not leave water', 'Bog Ground']
      Lowtide/Campaigns/Salt and Lantern/Sessions/Session 2/Session 2 - Recap.md: ['Two \[\[Mire Drowner\]\] creatures attacked from the mud', 'one charge of the \[\[Ebb Lantern\]\]']
  rubrics:
    - The Agent distinguishes the DM's report that the fight felt soft from the Recap's evidence, without inventing a turn-by-turn record, and explains each change using the actual Party's damage, control and escape options.
    - The revised block's arithmetic passes; the reply models the requested encounter count with realistic three-round actions and names a sourced peer rather than averaging invented defensive and offensive CRs.
    - Existing appearance, ecology, origin, non-speaking behaviour, Sable connection and mud interactions survive; played Session pages and already-heard Narration are unchanged.
    - The reply identifies Sable as an affected NPC, and retuning keeps the Ebb Lantern and ally rescue usable rather than cancelling the Party's counterplay.
- id: reuse-thug
  prompt: I need stats for an ordinary Reedrunner thug, the kind that rows the tithe boats. Nothing fancy.
  rubrics:
    - Recorded retrieval searches the Wiki then the 2024 SRD, reusing a fitting block whole or with fiction-only reskinning, with a source and reason; higher-tier sources are used only if the earlier tiers do not fit.
    - Any created Creature page holds the complete retrieved rules and passes every gate layer; an existing fitting page is reused without unnecessary duplication.
    - The reply is proportionate to "nothing fancy", and published statistics have not been silently increased to satisfy a bespoke tuning target.
