# Default case (creature split 2026-10-11: the in-world Creature page with every section). Adapts the recovered production retune ask in issue #34 into a complete Creature request.
- id: creature
  source_pages:
    - shattered-sea/NPCs/talon-skarn.md
    - shattered-sea/Creatures/talon-skarn-creature.md
    - shattered-sea/Sessions/Session 11/session-11-recap.md
  prompt: >-
    Redo Talon Skarn's statblock so he's a powerful, engaging antagonist
    and fun for the Party to fight. He wants Crissdalynn's Fate Spinner
    for Vantyrus, not a prolonged fight, and he's loyal to Vantyrus for now.
    Jean-Claude will be awake next Session. Keep Skarn easy for me to run.
    Make the whole Creature page usable, not just the numbers, with a
    proper first sight I can read out and what he's like outside a fight.
  checks:
    pages:
      - shattered-sea/Creatures/talon-skarn-creature.md
    sections:
      shattered-sea/Creatures/talon-skarn-creature.md:
        - "## At a glance"
        - "## Statblock"
        - "### Tactics"
        - "### Outside a fight"
        - "### Ecology"
        - "### Hidden truths"
        - "## Links"
    canon:
      shattered-sea/Creatures/talon-skarn-creature.md:
        - '^type:\s*Creature\s*$'
        - 'layout: Basic 5e Layout'
        - '^```statblock\b'
        - '\[!narration\] First sight'
    absent:
      shattered-sea/NPCs/talon-skarn.md:
        - '^```statblock\b'
        - '!\[\[[^\]|]+#Statblock(\|[^\]]*)?\]\]'
  rubrics:
    - >-
      The fight is the one the DM asked for: Skarn goes for Crissdalynn's
      Fate Spinner rather than a long brawl. The theft plays as an
      interruptible contest with tells the Party can see coming, distinct
      ways to stop it and real choices about position, flight and rescuing
      an ally; it stays tense and winnable, never a required loss or a
      damage race.
    - >-
      Skarn reads as this falcon-headed thief and nobody else: his look,
      habits, traces and life outside a fight give the DM a peregrine monk
      to play in a conversation or a chase, and each hidden truth has a
      concrete way to come out in play.
    - >-
      The statblock is correct, complete and easy to run at the table under
      the 2024 rules: clear timing, targets, limits and condition endings,
      short tactics and a clear point where he breaks off, pitched as a
      powerful antagonist without the DM rebuilding anything.
    - >-
      His established identity, knowledge, withdrawal and spent resources
      hold except where the DM changed them. Present loyalty to Vantyrus can
      sit beside a future Rule of Two rivalry, and the unresolved Session 11
      attack is not rewritten as a completed theft or breakoff, with played
      records unchanged.
    - >-
      First sight lands in one hearing and puts Skarn in the listeners'
      sight as this falcon-headed monk rather than a generic silhouette:
      size against something familiar on a body scale or in one staged
      image, a grounded detail beyond sight and the visible tells of his
      signature. It stops before Players act, tells them no feelings,
      mechanics, hidden motives or things their characters have not
      learned, and respects Narration already heard at the table.

# creature split 2026-10-11: generic reusable monster, statblock only, no World. Files a World-free page at the vault root's Creatures/ from wiki/templates/creature.md, keeping only its Statblock and Links Base (docs/wiki-layout.md **World-free pages**, ADR 0039). No source_pages by design (evals/README.md § Grounding); Design verdict pending its first baseline run. Derived-number arithmetic is the Checks' `statblock` gate layer, not a rubric.
- id: generic-monster
  prompt: >-
    I want a monster for my own collection that isn't tied to any campaign
    or world, so I can drop it into any game. Call it a Mire Lurker: a swamp
    ambusher around CR 3 that bites, grabs someone and drags them under the
    water. 2024 rules, and keep it easy to run.
  checks:
    pages:
      - Creatures/mire-lurker.md
    sections:
      Creatures/mire-lurker.md:
        - "## Statblock"
        - "## Links"
    canon:
      Creatures/mire-lurker.md:
        - '^type:\s*Creature\s*$'
        - '^```base\b'
        - '^```statblock\b'
        - '^layout: Basic 5e Layout\s*$'
        - '(Melee|Ranged) Attack Roll:'
    absent:
      Creatures/mire-lurker.md:
        - '^##+ (?!(Statblock|Links)\s*$)'
        - '^kind:'
        - '\[!narration\]'
        - 'Weapon Attack:'
  rubrics:
    - >-
      The statblock is correct, complete and easy to run at the table under
      the 2024 rules at about CR 3: every entry gives its timing, targets,
      reach or range and results. The grab names its escape, and the drag
      under has a limit and at least two answers its own text gives.
    - >-
      The monster drops into any campaign: a plain kind name with no proper
      noun, place, faction, deity or World fact, and no lore, tactics or
      Narration beside the block. Every feature beyond its core attacks and
      signature fits any setting and earns its place; nothing is padding.
