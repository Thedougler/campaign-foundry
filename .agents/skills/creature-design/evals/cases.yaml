# Adapts the recovered production retune ask in issue #34 into a complete Creature request.
- id: creature
  source_pages:
    - shattered-sea/NPCs/Talon Skarn.md
    - shattered-sea/Creatures/Talon Skarn (Creature).md
    - shattered-sea/Sessions/Session 11/Session 11 - Recap.md
  prompt: >-
    Redo Talon Skarn's statblock so he's a powerful, engaging antagonist
    and fun for the Party to fight. He wants Crissdalynn's Fate Spinner
    for Vantyrus, not a prolonged fight, and he's loyal to Vantyrus for now.
    Jean-Claude will be awake next Session. Keep Skarn easy for me to run.
    Make the whole Creature page usable, not just the numbers, with a
    proper first sight I can read out and what he's like outside a fight.
  checks:
    pages:
      - shattered-sea/Creatures/Talon Skarn (Creature).md
    sections:
      shattered-sea/Creatures/Talon Skarn (Creature).md:
        - "## At a glance"
        - "## Statblock"
        - "### Tactics"
        - "### Outside a fight"
        - "### Ecology"
        - "### Hidden truths"
        - "## Links"
    canon:
      shattered-sea/Creatures/Talon Skarn (Creature).md:
        - '^type:\s*Creature\s*$'
        - 'layout: Basic 5e Layout'
        - '^```statblock\b'
        - '\[!narration\] First sight'
    absent:
      shattered-sea/NPCs/Talon Skarn.md:
        - '^```statblock\b'
        - '!\[\[[^\]]+#Statblock\]\]'
  rubrics:
    - >-
      Skarn is runnable from the page alone: complete rules, clear timing,
      targets, limits and condition endings, concise tactics and an ending
      condition. Theft is an interruptible contest with visible tells,
      distinct tactical answers and meaningful positioning, control, flight
      and allied rescue choices, not a required loss or overwhelming damage.
    - >-
      The retune uses legal 2024 rules and this run's actual PC Sheets,
      equipment and applicable House Rules, with Jean-Claude awake. A legal
      short combat model and appropriate retrieved peer support likely
      damage, control, survival and the chosen threat without erasing PC
      strengths. Estimates are not invented rounds, totals or table feedback.
    - >-
      Skarn's appearance, habits, traces, habitat and discoverable background
      express this peregrine thief rather than a generic flying boss.
      Signatures have perceivable signs before contact and useful answers;
      hidden truths have concrete ways to learn them.
    - >-
      Identity, knowledge, withdrawal and spent resources remain consistent
      with the sources except for explicit DM changes. Present loyalty can
      coexist with future Rule of Two rivalry. The unresolved Session 11
      attack is not rewritten as a completed theft or breakoff; shared
      consumers stay consistent and played records remain unchanged.
    - >-
      First sight is speakable after one hearing, putting Skarn in the
      listeners' sight with concrete form specific to this falcon-headed monk
      rather than a generic silhouette, size against something familiar on a
      body scale or in one staged image rather than a than-verdict, a
      grounded nonvisual detail and visible signature tells. It stops before
      Players act and contains no PC feelings, mechanics, hidden motives or
      unearned knowledge; established heard Narration is respected.
