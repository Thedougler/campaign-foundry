# Grounded adaptation of an existing cutter; no original Saltwright creation ask was recovered.
- id: uncertainty-underway
  source_pages:
    - The Shattered Sea/Vehicles/Uncertainty.md
    - The Shattered Sea/NPCs/Geoffrey Draves.md
    - The Shattered Sea/NPCs/Thunk.md
  prompt: >-
    Make Uncertainty ready to run for a rescue embarkation, a Crown chase
    and a boarding off Aruhe. Geoffrey is acting captain while the Party
    is inland. Flesh out the decks, crew stations and ship rules so damage
    and manoeuvres give the crew interesting choices.
  checks:
    pages:
      - The Shattered Sea/Vehicles/Uncertainty.md
    sections:
      The Shattered Sea/Vehicles/Uncertainty.md:
        - "### Statistics"
        - "### Crew and stations"
        - "### Components and weapons"
        - "### Underway"
    canon:
      The Shattered Sea/Vehicles/Uncertainty.md:
        - '^type:\s*Vehicle\s*$'
  rubrics:
    - >-
      The starting cutter's identity, scale, hull statistics, complement,
      passengers, refit and Thunk's role survive. Geoffrey's acting captain
      appointment follows the DM over the starting absence of a captain.
      Current offshore location is distinguished from the historical refit
      berth and any prospective embarkation.
    - >-
      Suitable retrieved craft rules support new speed, staffing, capacity,
      component and weapon figures, with adaptations attributed honestly.
      Older nautical rules are not called published 2024 rules, and figures
      are not borrowed indiscriminately from a much larger warship.
    - >-
      Body-scale deck areas, assigned stations, minimum versus present
      staffing and empty-station consequences let the DM run embarkation,
      chase and boarding from the page. Damage and manoeuvres change
      reachable choices; the actual Party's mobility and participation are
      respected. Fighting crew link complete Creature owners.
    - >-
      Signature and handling distinguish this captured, refitted cutter
      and its rescue obligations from a generic ship. New layout, cargo
      conflicts and missing rules are design, not historical discoveries.
      The work does not record a completed chase, rescue or boarding as play,
      and existing Session history remains unchanged.

