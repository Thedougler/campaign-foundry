# Grounded adaptation of an existing cutter; Saltwright's inspection needs are covered here.
- id: vehicle
  source_pages:
    - shattered-sea/Vehicles/uncertainty.md
    - shattered-sea/NPCs/geoffrey-draves.md
    - shattered-sea/NPCs/thunk.md
    - shattered-sea/Locations/western-landing.md
  prompt: >-
    Make Uncertainty ready to run for a rescue embarkation, a Crown chase
    and a boarding off Aruhe. Geoffrey is acting captain while the Party
    is inland. Flesh out the decks, crew stations and ship rules so damage
    and manoeuvres give the crew interesting choices. Include sneaking
    through the hold or aboard from a small boat, the ship's background,
    and a proper first sight I can read out. I want the whole Vehicle page.
  checks:
    pages:
      - shattered-sea/Vehicles/uncertainty.md
    sections:
      shattered-sea/Vehicles/uncertainty.md:
        - "## At a glance"
        - "### Statistics"
        - "### Crew and stations"
        - "### Components and weapons"
        - "### Underway"
        - "### History"
        - "### Hidden truths"
        - "## Links"
    canon:
      shattered-sea/Vehicles/uncertainty.md:
        - '^type:\s*Vehicle\s*$'
        - '\[!narration\] First sight'
  rubrics:
    - >-
      The page alone runs rescue embarkation, chase, boarding and a
      stowaway's sneak. Body-scale deck areas, hold, approaches, helm and
      connected routes support navigation and tactical choices. Stations
      identify present versus minimum staffing and empty-station
      consequences; damage and manoeuvres change what the crew can do
      rather than requiring invented procedures during play.
    - >-
      Suitable retrieved craft rules support speed, staffing, capacity,
      hull and component defences, weapon attacks and damage, and clear
      disabled or sinking consequences. Adaptations are attributed honestly;
      older nautical rules are not called published 2024 rules or borrowed
      indiscriminately from a larger warship. Fighting crew link complete
      Creature owners and participation respects the actual Party's strength
      and mobility.
    - >-
      A recognisable signature, fiction-backed handling quirk and something
      aboard worth paying, fighting or lying for distinguish this captured,
      refitted cutter from a generic ship. Its current errand, response to
      the Party and rescue obligations matter in play. History and hidden
      truths have concrete ways to learn them.
    - >-
      Cutter identity, scale, hull statistics, complement, passengers,
      refit and Thunk's role survive; Geoffrey's acting appointment follows
      the DM. The current offshore position is distinct from the historical
      berth and prospective embarkation. New decks, cargo conflicts and
      missing rules are design, not historical discoveries; no completed
      chase, rescue or boarding is recorded and Session history is unchanged.
    - >-
      First sight is speakable after one hearing, with concrete hull form
      and size against something familiar, grounded nonvisual detail and
      a usable way alongside or aboard. Visible features communicate the
      craft's signature and handling without revealing a closed hold or
      hidden truths. It stops before Players act and contains no PC
      feelings, mechanics or unearned knowledge; heard Narration is respected.
