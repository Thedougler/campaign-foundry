# Vale config for the Wiki, read by the `style` layer of `cf check` (and by editors running Vale).
# `bun run setup` runs `vale sync`, which downloads the pinned ai-tells package into .vale/styles/.
# The committed `Narration` style lives in .vale/styles/Narration/ and is not synced.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# tbhb/vale-ai-tells, pinned to a release so a new upstream rule never changes what the gate fails on.
# To upgrade: change the version here, run `bun run setup`, then `bun run cf check` and review any new findings.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, Narration

# Preserve the existing gate: these rules remain errors when Vale warnings become advisory.
Narration.NoEmDash = error
Narration.NoSemicolon = error
Narration.NoColon = error
