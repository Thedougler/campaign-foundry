# Vale config for the Wiki, read by the `style` layer of `cf check` (and by editors running Vale).
# `bun run setup` runs `vale sync`, which downloads the pinned ai-tells package into .vale/styles/.
# The committed `Narration` style lives in .vale/styles/Narration/ and is not synced.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# tbhb/vale-ai-tells, pinned to a release so a new upstream rule never changes what the gate fails on.
# To upgrade: change the version here, run `bun run setup`, then `bun run cf check` and review any new findings.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, Narration

# Game terms that ai-tells reads as filler vocabulary. "Utilize" is the name of an action in the 2024 rules
# ("take the Utilize action"), so only that phrase is ignored and "utilize" elsewhere still fails. "grapple" is a
# combat rule (the Grappled condition, "escaping a grapple") on every Creature that restrains. Vale's regexes
# cannot look ahead, so every form of the word is ignored, which also lets the figurative "grapple with" pass.
TokenIgnores = (\bthe Utilize action\b), (\b[Gg]rappl(?:e|es|ed|ing)\b)

# ai-tells targets technical documentation. Each rule switched off below misfires on legitimate campaign
# prose, and most of their own messages say to disable them for such prose. We ran the package over the
# fixture Wiki and over realistic Session prep and Narration to find these.

# Literal action and place verbs. In a setting guide a guard holds a door, a ship sits in a harbour, a goblin
# lands on a table, and the Party travels to a town: a body does the action, not a tool.
ai-tells.BareHolds = NO
ai-tells.BareReaches = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeLands = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeTravels = NO
ai-tells.FigurativeTrips = NO

# Money and ownership are literal in a world with gold pieces, debts and landlords: a captain owns the port,
# a boatman earns a coin, a ledger settles a debt.
ai-tells.FigurativeEarns = NO
ai-tells.FigurativeOwns = NO
ai-tells.FigurativePays = NO

# "Places worth reaching" is a Location template heading, and "a place worth visiting" is plain description.
ai-tells.FigurativeWorth = NO

# "Can surface in" is the Clue template's own column heading, and a Clue that "surfaces" in a Scene is the
# standard way to say it can be revealed there.
ai-tells.FigurativeSurfaces = NO

# Characters die ("the old queen died in the winter"), and their stories are about people, so the rules for
# mortality metaphors and for tools that "think" have nothing to catch.
ai-tells.MortalityMetaphors = NO
ai-tells.AnthropomorphicCognition = NO

# Ships are a Vehicle kind (CONTEXT.md) and the commonest craft in a sea-going World.
ai-tells.ShipOveruse = NO

# "Two guards flank the door" and "Three riders wait at the crossing" are how a DM opens a scene, and the
# rule reads every sentence that starts with a count as an announced list.
ai-tells.CataphoricForecasting = NO
