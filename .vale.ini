# Game terms that ai-tells reads as filler vocabulary. "Utilize" is the name of an action in the 2024 rules
# ("take the Utilize action"), so only that phrase is ignored and "utilize" elsewhere still fails. "grapple" is a
# combat rule (the Grappled condition, "escaping a grapple") on every Creature that restrains. Vale's regexes
# cannot look ahead, so every form of the word is ignored, which also lets the figurative "grapple with" pass.
TokenIgnores = (\bthe Utilize action\b), (\b[Gg]rappl(?:e|es|ed|ing)\b)

# The DM confirms every rule switched off here: only an obvious misfire on literal campaign meaning qualifies.

# Ships are a Vehicle kind (CONTEXT.md) and the commonest craft in a sea-going World.
ai-tells.ShipOveruse = NO

# A rule the DM confirmed misfires only on one subject keeps running with that subject excepted: `bun run setup`
# runs scripts/vale-patch.ts after `vale sync`. AnthropomorphicCognition excepts "DM", who is a person, and
# "them", the person pronoun its teaching span keeps ("the sages teach them").
