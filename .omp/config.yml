task:
  enableLsp: true
  maxRecursionDepth: 3
  agentModelOverrides:
    task: zai/glm-5.3
  # Dogfood units run `isolated: true`: each works in its own copy of the checkout,
  # and its changes are kept as a patch artifact, never applied to the real Wiki.
  isolation:
    enabled: true
    apply: false
    merge: patch
providers:
  maxInFlightRequests:
    anthropic: 4
    openai: 4
    openai-codex: 4
    zai: 4
ttsr:
  judge: "on"
skills:
  ignoredSkills:
    - "*-history-ingest"
    - code-understand
    - cross-linker
    - daily-update
    - graph-colorize
    - impl-validator
    - llm-wiki
    - memory-bridge
    - obsidian-layout-adjustment
    - omp
    - prompt-optimizer
    - sentry-cli
    - session-brain
    - session-search
    - tag-taxonomy
    - vault-skill-factory
    - vercel-*
    - wiki-*
    - tavily-*
    - exa-search
    - firecrawl-scrape
