- id: after-move
  source_pages:
    - shattered-sea/Locations/aruhe.md
  prompt: Lint the Wiki.
  checks:
    canon:
      shattered-sea/log.md: ['/\] lint \|/']
      shattered-sea/Locations/aruhe.md:
        - 'A vast untamed volcanic island where excessive life distinguishes receiving from taking.'
        - 'Hinewai''s grief binds the island''s living systems.'
    absent:
      shattered-sea/log.md: ['Campaigns/']
  rubrics:
    - Mechanical template, heading, link, placement and index defects are repaired, and the lint log identifies every touched page at its final path.
    - Ambiguous choices follow retrieved Wiki evidence. Every finding, warnings included, is fixed; none is left for the DM.
    - Existing pages and their factual meanings survive without creation, splitting, deletion or merging. Aruhe's receiving-versus-taking law and Hinewai's grief keep this run's starting meaning; only sentences carrying a finding are reworded.
    - The full gate ends with zero findings, and the reply reports the repairs briefly without asking the DM anything.
