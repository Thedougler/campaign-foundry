[project]
name = "campaign-foundry"
version = "0.1.0"
description = "Python side of Campaign Foundry: features ported from the DM's Python tooling, run under uv."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
	"pytest>=8.4",
	"ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
